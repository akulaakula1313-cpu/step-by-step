<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Подкидной Дурак (с Ботами и Онлайн)</title>
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Montserrat:wght@500;600;700&display=swap');
        
        :root { 
            --felt-bg: #0b4d2b; 
            --felt-dark: #062e1a; 
            --gold: #f3c653; 
            --red: #e63946; 
            --card-w: 70px; 
            --card-h: 102px;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; background: #04180e; 
            font-family: 'Montserrat', sans-serif; color: #fff; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden; 
        }

        #game-container { 
            width: 100vw; height: 100vh; max-width: 1200px; max-height: 800px;
            background: radial-gradient(circle at 50% 40%, #156b3e 0%, var(--felt-bg) 50%, var(--felt-dark) 100%);
            position: relative; display: flex; flex-direction: column; justify-content: space-between; 
            padding: 10px; border: 4px solid #052917; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        @media (min-width: 768px) {
            :root { --card-w: 80px; --card-h: 116px; }
            #game-container { border-radius: 20px; border-width: 8px; padding: 15px 25px; height: 85vh; }
        }

        #main-menu { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(4, 20, 12, 0.97); backdrop-filter: blur(8px); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 300; padding: 15px;
        }

        .menu-logo { font-family: 'Cinzel', serif; font-size: 38px; font-weight: 800; color: var(--gold); margin-bottom: 2px; text-shadow: 0 4px 20px rgba(243,198,83,0.4); }
        .menu-subtitle { color: #8da396; font-size: 12px; margin-bottom: 15px; }
        .menu-panel { background: rgba(10, 42, 25, 0.8); border: 1px solid rgba(243, 198, 83, 0.2); padding: 15px 20px; border-radius: 14px; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }

        .player-count-selector { display: flex; justify-content: space-between; gap: 6px; }
        .count-btn { flex: 1; padding: 7px 0; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-weight: 700; cursor: pointer; font-size: 12px; }
        .count-btn.active { background: var(--gold); color: #111; border-color: var(--gold); }

        .btn { font-family: 'Montserrat', sans-serif; padding: 10px 14px; border: none; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; color: #fff; display: flex; justify-content: center; align-items: center; gap: 6px; width: 100%; }
        .btn-gold { background: linear-gradient(135deg, #f3c653 0%, #cca331 100%); color: #111; }
        .btn-primary { background: linear-gradient(135deg, #1d976c 0%, #116949 100%); }
        .btn-bot { background: linear-gradient(135deg, #3a86ef 0%, #205295 100%); }
        .btn-danger { background: linear-gradient(135deg, #e63946 0%, #b71c28 100%); }
        .btn:disabled { background: #2a3830 !important; color: #5d7367 !important; cursor: not-allowed; }

        .menu-divider { display: flex; align-items: center; text-align: center; color: #698275; font-size: 10px; text-transform: uppercase; margin: 2px 0; }
        .menu-divider::before, .menu-divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .menu-divider::before { margin-right: .6em; } .menu-divider::after { margin-left: .6em; }

        .room-row { display: flex; gap: 6px; }
        .room-input { flex: 1; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 8px; color: var(--gold); font-size: 12px; text-align: center; font-weight: 700; outline: none; text-transform: uppercase; }
        #menu-status { font-size: 11px; color: #f3c653; text-align: center; min-height: 14px; }

        .top-left-controls { position: absolute; left: 10px; top: 10px; z-index: 10; display: flex; gap: 5px; }
        .icon-btn { background: rgba(5, 36, 19, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); color: #cbd5e1; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 11px; }

        #deck-info { position: absolute; right: 10px; top: 10px; display: flex; gap: 8px; align-items: center; background: rgba(5, 36, 19, 0.8); padding: 5px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .mini-card-stack { width: 30px; height: 44px; background: radial-gradient(circle, #2a5298 0%, #1e3c72 100%); border: 1px solid #fff; border-radius: 3px; position: relative; }
        .deck-text { font-size: 11px; color: #cbd5e1; display: flex; flex-direction: column; }
        .deck-text b { color: var(--gold); }

        .opponents-row { display: flex; justify-content: center; gap: 8px; width: 100%; min-height: 70px; align-items: center; margin-top: 36px; padding: 0 5px; flex-wrap: wrap; }
        .opponent-box { background: rgba(5, 36, 19, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 110px; }
        .opponent-box.active-turn { border-color: var(--gold); box-shadow: 0 0 8px rgba(243,198,83,0.4); }
        .opp-name { font-size: 10px; font-weight: 700; color: #cbd5e1; }
        .opp-cards { display: flex; }
        .mini-card { width: 18px; height: 28px; background: radial-gradient(circle, #2a5298 0%, #1e3c72 100%); border: 1px solid #fff; border-radius: 2px; margin-right: -8px; }
        .mini-card:last-child { margin-right: 0; }

        #middle-zone { flex: 1; background: rgba(4, 25, 14, 0.5); border-radius: 12px; border: 1px dashed rgba(255, 255, 255, 0.12); display: flex; align-items: center; padding: 8px 15px; position: relative; margin: 6px 0; overflow-x: auto; max-height: 150px; }
        .zone-title { position: absolute; top: -8px; left: 12px; background: #093820; padding: 1px 8px; border-radius: 4px; font-size: 9px; color: var(--gold); font-weight: 700; border: 1px solid rgba(243,198,83,0.2); }

        .card { width: var(--card-w); height: var(--card-h); background: linear-gradient(135deg, #ffffff 0%, #f3f3ee 100%); border-radius: 6px; box-shadow: -2px 3px 8px rgba(0,0,0,0.3); position: relative; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; padding: 4px 6px; font-weight: 700; flex-shrink: 0; }
        .card.red { color: #d62828; } .card.black { color: #1b263b; }
        .card-rank { font-size: 12px; font-family: 'Cinzel', serif; }
        .card-suit { font-size: 10px; }
        .card-center-suit { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 22px; opacity: 0.9; }

        .table-pair { position: relative; width: calc(var(--card-w) + 16px); height: var(--card-h); flex-shrink: 0; }
        .table-pair .card:first-child { position: absolute; left: 0; top: 0; }
        .table-pair .card:nth-child(2) { position: absolute; left: 14px; top: 10px; z-index: 5; }

        #control-panel { display: flex; justify-content: space-between; align-items: center; padding: 4px 5px; gap: 8px; }
        #message-box { font-size: 11px; color: var(--gold); font-weight: 600; background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 6px; border-left: 3px solid var(--gold); flex: 1; text-align: center; }
        #message-box.error { color: #ff6b6b; border-left-color: #ff6b6b; }
        .actions { display: flex; gap: 6px; }

        #player-zone { min-height: 120px; display: flex; flex-direction: column; align-items: center; position: relative; padding-top: 10px; }
        .hand-cards { display: flex; justify-content: center; align-items: flex-end; max-width: 100%; overflow-x: auto; padding: 5px; }
        .hand-card-wrap { cursor: pointer; flex-shrink: 0; transition: transform 0.2s; position: relative; }
        .hand-card-wrap:hover { transform: translateY(-12px); z-index: 100; }

        #game-over-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 20, 12, 0.96); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 250; padding: 15px; }
        #game-over-screen h1 { font-family: 'Cinzel', serif; font-size: 32px; color: var(--gold); margin-bottom: 6px; }
        #rematch-timer-text { font-size: 13px; color: #cbd5e1; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>
<div id="game-container">
    <div id="main-menu">
        <div class="menu-logo">ДУРАК</div>
        <div class="menu-subtitle">Онлайн и Игра с Ботами</div>
        <div class="menu-panel">
            <div style="font-size: 11px; color: #8da396; text-align: center;">Количество игроков:</div>
            <div class="player-count-selector">
                <button class="count-btn active" onclick="selectCount(2)">2</button>
                <button class="count-btn" onclick="selectCount(3)">3</button>
                <button class="count-btn" onclick="selectCount(4)">4</button>
            </div>
            <button class="btn btn-bot" onclick="playWithBots()">🤖 Играть с ботами</button>
            <div class="menu-divider">или по сети</div>
            <button class="btn btn-gold" onclick="createRoom()">✨ Создать комнату</button>
            <div class="room-row">
                <input type="text" id="room-code-input" class="room-input" placeholder="Код" maxlength="6">
                <button class="btn btn-primary" style="width: 80px;" onclick="joinRoom()">Войти</button>
            </div>
            <div id="menu-status"></div>
        </div>
    </div>

    <div class="top-left-controls">
        <button class="icon-btn" onclick="location.reload()">🏠 Меню</button>
        <button id="music-btn" class="icon-btn" onclick="toggleMusic()">🎵 Музыка</button>
    </div>

    <div id="deck-info">
        <div style="position: relative; width: 26px; height: 38px;">
            <div id="trump-container"></div>
            <div class="mini-card-stack" style="width: 26px; height: 38px;"></div>
        </div>
        <div class="deck-text">
            <div id="trump-label">Козырь: -</div>
            <div id="deck-count">В колоде: 36</div>
        </div>
    </div>

    <div id="middle-zone">
        <div class="zone-title">Игровой стол</div>
        <div id="table-pairs-container" style="display: flex; gap: 10px; align-items: center; width: 100%;"></div>
    </div>

    <div id="control-panel">
        <div id="message-box">Ожидание...</div>
        <div class="actions">
            <button id="btn-take" class="btn btn-danger" style="width: 90px; padding: 8px;" onclick="sendAction('take')" disabled>БЕРУ</button>
            <button id="btn-done" class="btn btn-gold" style="width: 95px; padding: 8px;" onclick="sendAction('done')" disabled>ГОТОВО</button>
        </div>
    </div>

    <div id="player-zone">
        <div class="zone-title" style="top: -2px; left: 50%; transform: translateX(-50%);">Ваши карты</div>
        <div id="player-cards-container" class="hand-cards"></div>
    </div>

    <div id="game-over-screen">
        <h1 id="winner-title">ИГРА ОКОНЧЕНА</h1>
        <div id="rematch-timer-text">Новая игра через: <span id="timer-sec">10</span> сек. (Голосов: <span id="votes-count">0</span>)</div>
        <button id="btn-rematch" class="btn btn-gold" style="max-width: 200px;" onclick="voteRematch()">🔄 Играть снова</button>
    </div>
</div>

<script>
    const socket = io();
    let selectedMaxPlayers = 2;
    let currentRoomCode = null;
    let gameState = null;

    const bgMusic = new Audio('/theme.mp3'); 
    bgMusic.loop = true;
    bgMusic.volume = 0.3;
    let musicEnabled = true;
    let userInteracted = false;

    document.addEventListener('click', () => { userInteracted = true; }, { once: true });

    function toggleMusic() {
        musicEnabled = !musicEnabled;
        const btn = document.getElementById('music-btn');
        if (musicEnabled) {
            btn.innerText = "🎵 Музыка";
            if (gameState && !gameState.isGameOver) bgMusic.play().catch(() => {});
        } else {
            btn.innerText = "🔇 Музыка";
            bgMusic.pause();
        }
    }

    socket.on('play_music', () => {
        if (!musicEnabled) return;
        bgMusic.currentTime = 0;
        if (userInteracted) bgMusic.play().catch(() => {});
    });

    socket.on('game_over', () => { bgMusic.pause(); bgMusic.currentTime = 0; });
    socket.on('room_expired', () => { bgMusic.pause(); });

    function selectCount(num) {
        selectedMaxPlayers = num;
        document.querySelectorAll('.count-btn').forEach(btn => { btn.classList.toggle('active', btn.innerText == num); });
    }

    function setMenuStatus(text) { document.getElementById('menu-status').innerText = text; }
    function showMessage(text, isError = false) {
        let msgBox = document.getElementById('message-box');
        msgBox.innerText = text;
        if (isError) { msgBox.classList.add('error'); setTimeout(() => msgBox.classList.remove('error'), 3000); }
    }

    function playWithBots() { setMenuStatus("Запуск..."); socket.emit('play_with_bots', selectedMaxPlayers); }
    function createRoom() { setMenuStatus("Создание..."); socket.emit('create_room', selectedMaxPlayers); }
    function joinRoom() {
        let code = document.getElementById('room-code-input').value.trim().toUpperCase();
        if (!code) { setMenuStatus("Введите код!"); return; }
        setMenuStatus("Подключение...");
        currentRoomCode = code;
        socket.emit('join_room', code);
    }

    socket.on('room_created', (data) => { currentRoomCode = data.code; document.getElementById('main-menu').style.display = 'none'; showMessage(`Комната: ${data.code}. Ожидание (1/${data.maxPlayers})`); });
    socket.on('lobby_update', (data) => { currentRoomCode = data.code; document.getElementById('main-menu').style.display = 'none'; showMessage(`Комната: ${data.code}. Игроков: ${data.current}/${data.max}`); });
    socket.on('error_msg', (msg) => { setMenuStatus(msg); showMessage(msg, true); });
    socket.on('opponent_disconnected', () => { alert("Игрок вышел."); location.reload(); });
    socket.on('room_expired', () => { alert("Время истекло."); location.reload(); });

    socket.on('game_update', (state) => {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('game-over-screen').style.display = 'none';
        gameState = state;
        if (state.roomCode) currentRoomCode = state.roomCode;
        render();
    });

    socket.on('game_over', (data) => {
        document.getElementById('game-over-screen').style.display = 'flex';
        let isWinner = data.winner === socket.id;
        document.getElementById('winner-title').innerText = isWinner ? "ПОБЕДА!" : (data.winner ? "ВЫ ПРОИГРАЛИ" : "НИЧЬЯ!");
        document.getElementById('btn-rematch').disabled = false;
        document.getElementById('btn-rematch').innerText = "🔄 Играть снова";
    });

    socket.on('rematch_timer', (sec) => { document.getElementById('timer-sec').innerText = sec; });
    socket.on('rematch_voted', (data) => { document.getElementById('votes-count').innerText = `${data.votesCount}/${data.totalNeeded}`; });
    socket.on('game_restarted', () => {
        document.getElementById('game-over-screen').style.display = 'none';
        document.getElementById('btn-rematch').disabled = false;
        document.getElementById('btn-rematch').innerText = "🔄 Играть снова";
    });

    function voteRematch() {
        document.getElementById('btn-rematch').disabled = true;
        document.getElementById('btn-rematch').innerText = "Голос принят...";
        if (currentRoomCode) socket.emit('vote_rematch', currentRoomCode);
    }

    function isRed(suit) { return suit === "♥" || suit === "♦"; }

    function renderCardHTML(card) {
        let colorClass = isRed(card.suit) ? "red" : "black";
        return `<div class="card ${colorClass}"> 
            <div><div class="card-rank">${card.rank}</div><div class="card-suit">${card.suit}</div></div> 
            <div class="card-center-suit">${card.suit}</div> 
            <div style="transform: rotate(180deg); text-align: right;"><div class="card-rank" style="text-align:right;">${card.rank}</div><div class="card-suit" style="text-align:right;">${card.suit}</div></div> 
        </div>`;
    }

    function render() {
        if (!gameState) return;
        let myId = socket.id;
        let playersInfo = gameState.playersInfo;
        let myHand = gameState.hands[myId] || [];

        let oppContainer = document.getElementById('opponents-container');
        oppContainer.innerHTML = "";
        playersInfo.forEach((p) => {
            if (p.id === myId) return;
            let count = (gameState.hands[p.id] || []).length;
            let isAtt = playersInfo[gameState.attackerIdx].id === p.id;
            let isDef = playersInfo[gameState.defenderIdx].id === p.id;
            let roleText = isAtt ? "⚔️ Атака" : (isDef ? "🛡️ Защита" : "⏳ Ждет");
            let miniCardsHTML = Array(count).fill(0).map(() => `<div class="mini-card"></div>`).join('');
            oppContainer.innerHTML += `<div class="opponent-box ${isAtt || isDef ? 'active-turn' : ''}"><div class="opp-name">${p.name} (${count}) • ${roleText}</div><div class="opp-cards">${miniCardsHTML}</div></div>`;
        });

        document.getElementById('deck-count').innerHTML = `В колоде: <b>${gameState.deck.length}</b>`;
        let trumpCont = document.getElementById('trump-container');
        if (gameState.trumpCard) {
            trumpCont.innerHTML = `<div style="position:absolute; top:-16px; left:-2px; transform: rotate(90deg) scale(0.28); transform-origin: top left;">${renderCardHTML(gameState.trumpCard)}</div>`;
            document.getElementById('trump-label').innerHTML = `Козырь: <b>${gameState.trumpCard.rank}${gameState.trumpCard.suit}</b>`;
        } else {
            trumpCont.innerHTML = "";
            document.getElementById('trump-label').innerHTML = `Козырь: <b>${gameState.trumpSuit}</b>`;
        }

        document.getElementById('table-pairs-container').innerHTML = gameState.table.map(p => `
            <div class="table-pair">${renderCardHTML(p.attack)}${p.defense ? renderCardHTML(p.defense) : ''}</div>
        `).join('');

        let handContainer = document.getElementById('player-cards-container');
        let cardCount = myHand.length;
        let cardW = window.innerWidth < 768 ? 70 : 80;
        let availableWidth = Math.min(window.innerWidth - 40, 750);
        let dynamicMargin = cardCount > 1 ? Math.min(-15, Math.floor((availableWidth - (cardCount * cardW)) / (cardCount - 1))) : 0;
        if (dynamicMargin > 5) dynamicMargin = 5;

        handContainer.innerHTML = myHand.map((card, idx) => `
            <div class="hand-card-wrap" style="margin-right: ${idx === cardCount - 1 ? 0 : dynamicMargin}px; z-index: ${idx};" onclick="playCard(${idx})">
                ${renderCardHTML(card)}
            </div>
        `).join('');

        let isAttacker = playersInfo[gameState.attackerIdx].id === myId;
        let isDefender = playersInfo[gameState.defenderIdx].id === myId;
        if (isDefender) { showMessage("Вы защищаетесь!"); }
        else if (isAttacker || gameState.table.length > 0) { showMessage("Ваш ход / Подкидывание"); }
        else { showMessage("Ход соперника..."); }

        let allCovered = gameState.table.length > 0 && gameState.table.every(p => p.defense !== null);
        document.getElementById('btn-take').disabled = !isDefender || gameState.table.length === 0;
        document.getElementById('btn-done').disabled = gameState.table.length === 0 || !allCovered || !isAttacker;
    }

    function playCard(cardIdx) {
        if (!currentRoomCode) { showMessage("Ошибка комнаты", true); return; }
        socket.emit('player_action', { roomCode: currentRoomCode, action: 'play_card', cardIdx });
    }

    function sendAction(action) {
        if (!currentRoomCode) return;
        socket.emit('player_action', { roomCode: currentRoomCode, action });
    }
</script>
</body>
</html>
