<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карточная игра «Дурак»</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b2e13; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Top bar */
        .top-bar { display: flex; justify-content: space-between; padding: 10px 20px; background: rgba(0,0,0,0.3); font-size: 14px; }
        .room-code-badge { background: #d4af37; color: #000; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        
        /* Screens */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        #lobby-screen { z-index: 100; background: rgba(0, 0, 0, 0.7); }
        #game-screen { z-index: 10; display: none; flex-direction: column; justify-content: space-between; padding: 20px; }

        /* Modal Card in Lobby */
        .modal-card { background: #161a1d; padding: 30px; border-radius: 12px; width: 420px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); text-align: center; border: 1px solid #2b3035; position: relative; z-index: 101; }
        .modal-card h2 { margin-bottom: 20px; font-size: 20px; color: #e0e0e0; }
        
        .player-count-btns { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
        .count-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #2b3035; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .count-btn.active, .count-btn:hover { background: #198754; }
        
        .action-btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 12px; font-size: 14px; text-transform: uppercase; transition: 0.2s; }
        .btn-bots { background: #ffc107; color: #000; }
        .btn-bots:hover { background: #e0a800; }
        .btn-create { background: #ffc107; color: #000; }
        .btn-create:hover { background: #e0a800; }
        
        .join-row { display: flex; gap: 8px; margin-top: 10px; }
        .join-input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #495057; background: #212529; color: #fff; text-transform: uppercase; text-align: center; }
        .btn-join { padding: 10px 20px; background: #ffc107; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .lobby-status { margin-top: 15px; font-size: 13px; color: #adb5bd; }

        /* Game UI Controls */
        .game-controls { display: flex; justify-content: center; gap: 10px; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 8px; align-self: center; z-index: 20; }
        .ctrl-btn { padding: 8px 24px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: #fff; }
        #btn-take { background: #dc3545; }
        #btn-done { background: #198754; }
        #btn-pass { background: #0d6efd; }
        #btn-menu { background: #6c757d; }
        .ctrl-btn:hover { opacity: 0.9; }

        /* Overlay modal when room is created to highlight code */
        #room-created-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; }
        .room-created-content { background: #1e2229; padding: 30px; border-radius: 10px; text-align: center; border: 2px solid #ffc107; }
        .room-code-big { font-size: 28px; letter-spacing: 3px; color: #ffc107; font-weight: bold; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>♠ Карточная игра «Дурак»</div>
        <div id="top-room-badge" style="display:none;">КОМНАТА: <span id="lbl-room-code" class="room-code-badge"></span></div>
        <div>💬 Чат | 🎵 Звук</div>
    </div>

    <!-- MAIN LOBBY SCREEN -->
    <div id="lobby-screen" class="screen">
        <div class="modal-card">
            <h2>С кем будете играть?</h2>
            <div class="player-count-btns">
                <button class="count-btn active" onclick="setPlayers(2)">2</button>
                <button class="count-btn" onclick="setPlayers(3)">3</button>
                <button class="count-btn" onclick="setPlayers(4)">4</button>
            </div>
            
            <button class="action-btn btn-bots" onclick="playWithBots()">🤖 Играть с ботами</button>
            <button class="action-btn btn-create" onclick="createRoom()">✨ Создать комнату</button>
            
            <div class="join-row">
                <input type="text" id="room-code-input" class="join-input" placeholder="КОД КОМНАТЫ">
                <button class="btn-join" onclick="joinRoom()">Войти</button>
            </div>
            <div id="lobby-status" class="lobby-status">Ожидание игры...</div>
        </div>
    </div>

    <!-- ROOM CREATED POPUP (Ensures visibility) -->
    <div id="room-created-modal">
        <div class="room-created-content">
            <h3>Комната успешно создана!</h3>
            <p>Передайте этот код другу:</p>
            <div class="room-code-big" id="modal-big-code">------</div>
            <p style="font-size:12px; color:#aaa; margin-bottom: 15px;">Ожидание подключения игроков...</p>
            <button class="action-btn btn-create" onclick="closeCreatedModal()" style="margin:0;">Перейти к столу</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
        <div style="text-align: center; margin-top: 10px;">Игровой стол</div>
        <div id="game-table-area" style="flex:1; display:flex; justify-content:center; align-items:center;">
            <!-- Карты и логика стола -->
        </div>
        <div class="game-controls">
            <button id="btn-take" class="ctrl-btn" onclick="playerAction('take')">БЕРУ</button>
            <button id="btn-done" class="ctrl-btn" onclick="playerAction('done')">БИТО</button>
            <button id="btn-pass" class="ctrl-btn" onclick="playerAction('pass')">ПАС</button>
            <button id="btn-menu" class="ctrl-btn" onclick="leaveToMenu()">МЕНЮ</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let selectedMaxPlayers = 2;
        let currentRoomCode = null;

        function setPlayers(count) {
            selectedMaxPlayers = count;
            document.querySelectorAll('.count-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.innerText) === count);
            });
        }

        function createRoom() {
            socket.emit('create_room', selectedMaxPlayers);
        }

        function playWithBots() {
            socket.emit('play_with_bots', selectedMaxPlayers);
        }

        function joinRoom() {
            const code = document.getElementById('room-code-input').value.trim();
            if (code) socket.emit('join_room', code);
        }

        socket.on('room_created', ({ code }) => {
            currentRoomCode = code;
            document.getElementById('modal-big-code').innerText = code;
            document.getElementById('room-created-modal').style.display = 'flex';
        });

        function closeCreatedModal() {
            document.getElementById('room-created-modal').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('top-room-badge').style.display = 'block';
            document.getElementById('lbl-room-code').innerText = currentRoomCode;
        }

        socket.on('lobby_update', ({ code, current, max }) => {
            currentRoomCode = code;
            document.getElementById('lobby-status').innerText = `Ожидание игроков: ${current} / ${max}`;
        });

        socket.on('game_update', (state) => {
            document.getElementById('room-created-modal').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('top-room-badge').style.display = 'block';
            if (currentRoomCode) {
                document.getElementById('lbl-room-code').innerText = currentRoomCode;
            }
        });

        function playerAction(action) {
            if (!currentRoomCode) return;
            socket.emit('player_action', { roomCode: currentRoomCode, action });
        }

        function leaveToMenu() {
            if (currentRoomCode) {
                socket.emit('leave_room', currentRoomCode);
                currentRoomCode = null;
            }
            document.getElementById('room-created-modal').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('top-room-badge').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'flex';
            document.getElementById('lobby-status').innerText = 'Ожидание игры...';
        }

        socket.on('opponent_disconnected', () => {
            alert('Соперник покинул игру.');
            leaveToMenu();
        });

        socket.on('error_msg', (msg) => {
            alert(msg);
        });
    </script>
</body>
</html>
