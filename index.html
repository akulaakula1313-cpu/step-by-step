<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Подкидной Дурак (Premium Edition)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap');

        :root {
            --felt-bg: #0b4d2b;
            --felt-dark: #062e1a;
            --gold: #f3c653;
            --gold-glow: rgba(243, 198, 83, 0.4);
            --red: #e63946;
            --blue: #3a86ef;
            --card-w: 96px;
            --card-h: 140px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: #04180e;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 1100px;
            height: 750px;
            background: radial-gradient(circle at 50% 40%, #156b3e 0%, var(--felt-bg) 50%, var(--felt-dark) 100%);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 0 80px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 30px;
            border: 8px solid #052917;
            box-sizing: border-box;
        }

        #game-container::before {
            content: '';
            position: absolute;
            top: -8px; left: -8px; right: -8px; bottom: -8px;
            border-radius: 30px;
            border: 2px solid rgba(255,255,255,0.08);
            pointer-events: none;
        }

        #main-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 20, 12, 0.94);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
            border-radius: 16px;
        }

        .menu-logo {
            font-family: 'Cinzel', serif;
            font-size: 56px;
            font-weight: 800;
            color: var(--gold);
            text-shadow: 0 4px 20px rgba(243, 198, 83, 0.4);
            margin-bottom: 8px;
            letter-spacing: 3px;
        }

        .menu-subtitle {
            color: #8da396;
            font-size: 15px;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        .menu-panel {
            background: rgba(10, 42, 25, 0.7);
            border: 1px solid rgba(243, 198, 83, 0.2);
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 360px;
        }

        .btn {
            font-family: 'Montserrat', sans-serif;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            color: #fff;
            letter-spacing: 0.5px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-gold {
            background: linear-gradient(135deg, #f3c653 0%, #cca331 100%);
            color: #111;
            box-shadow: 0 4px 15px rgba(243, 198, 83, 0.3);
        }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(243, 198, 83, 0.5); }
        .btn-gold:active { transform: translateY(1px); }

        .btn-primary {
            background: linear-gradient(135deg, #1d976c 0%, #116949 100%);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-2px); }

        .btn-danger {
            background: linear-gradient(135deg, #e63946 0%, #b71c28 100%);
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.3);
        }
        .btn-danger:hover { filter: brightness(1.1); transform: translateY(-2px); }

        .btn-secondary {
            background: linear-gradient(135deg, #2b3a4a 0%, #1a232e 100%);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-secondary:hover { background: #344557; }

        .btn:disabled {
            background: #2a3830 !important;
            color: #5d7367 !important;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
            border-color: transparent !important;
        }

        .menu-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #698275;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 4px 0;
        }
        .menu-divider::before, .menu-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .menu-divider::before { margin-right: .8em; }
        .menu-divider::after { margin-left: .8em; }

        .room-row { display: flex; gap: 10px; }
        .room-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 12px;
            color: var(--gold);
            font-size: 15px;
            text-align: center;
            font-weight: 700;
            letter-spacing: 2px;
            outline: none;
        }
        .room-input::placeholder { color: #5a7366; font-weight: 500; letter-spacing: 0.5px; }
        .room-input:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(243,198,83,0.2); }

        .zone { display: flex; align-items: center; position: relative; }
        #bot-zone { height: 150px; justify-content: center; }
        #player-zone { height: 170px; justify-content: center; }

        #middle-zone {
            height: 230px;
            background: rgba(4, 25, 14, 0.5);
            border-radius: 16px;
            border: 1px dashed rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 4px 20px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            padding: 10px 25px;
            gap: 20px;
            overflow-x: auto;
            position: relative;
        }

        .zone-title {
            position: absolute;
            top: -10px;
            left: 15px;
            background: #093820;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--gold);
            text-transform: uppercase;
            font-weight: 700;
            border: 1px solid rgba(243,198,83,0.2);
        }

        .card {
            width: var(--card-w);
            height: var(--card-h);
            background: linear-gradient(135deg, #ffffff 0%, #f3f3ee 100%);
            border-radius: 10px;
            box-shadow: -2px 4px 12px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.1);
            position: relative;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s, margin 0.25s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px 10px;
            font-weight: 700;
            flex-shrink: 0;
            animation: dealCard 0.35s ease-out;
        }

        @keyframes dealCard {
            from { opacity: 0; transform: translateY(-30px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card.red { color: #d62828; }
        .card.black { color: #1b263b; }

        .card:hover {
            transform: translateY(-14px) scale(1.03);
            box-shadow: -4px 12px 25px rgba(0,0,0,0.5);
            z-index: 20;
        }

        .card-back {
            background: radial-gradient(circle, #2a5298 0%, #1e3c72 100%);
            border: 2px solid #fff;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4), -2px 4px 10px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255,255,255,0.35);
            font-size: 28px;
            cursor: default;
        }
        .card-back:hover { transform: none; box-shadow: -2px 4px 10px rgba(0,0,0,0.3); }

        .card-rank { font-size: 16px; line-height: 1; font-family: 'Cinzel', serif; font-weight: 700; }
        .card-suit { font-size: 14px; line-height: 1; margin-top: 2px; }
        .card-center-suit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 38px;
            opacity: 0.9;
        }

        #deck-info {
            position: absolute;
            right: 30px;
            top: 25px;
            display: flex;
            gap: 16px;
            align-items: center;
            background: rgba(5, 36, 19, 0.7);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .mini-card-stack {
            width: 44px;
            height: 66px;
            background: radial-gradient(circle, #2a5298 0%, #1e3c72 100%);
            border: 2px solid #fff;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .deck-text { font-size: 13px; color: #cbd5e1; display: flex; flex-direction: column; gap: 4px; }
        .deck-text b { color: var(--gold); }

        .table-pair { position: relative; width: 115px; height: var(--card-h); flex-shrink: 0; }
        .table-pair .card:first-child { position: absolute; left: 0; top: 0; }
        .table-pair .card:nth-child(2) { position: absolute; left: 25px; top: 16px; z-index: 5; }

        #control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            height: 55px;
        }

        #message-box {
            font-size: 15px;
            color: var(--gold);
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            background: rgba(0,0,0,0.25);
            padding: 8px 16px;
            border-radius: 8px;
            border-left: 3px solid var(--gold);
        }

        .actions { display: flex; gap: 12px; }

        .top-left-controls { position: absolute; left: 30px; top: 25px; display: flex; gap: 10px; z-index: 10; }

        .icon-btn {
            background: rgba(5, 36, 19, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .icon-btn:hover { background: rgba(15, 66, 36, 0.9); color: #fff; border-color: rgba(255,255,255,0.3); }

        #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 20, 12, 0.92);
            backdrop-filter: blur(6px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 250;
            border-radius: 16px;
        }
        #game-over-screen h1 {
            font-family: 'Cinzel', serif;
            font-size: 46px;
            color: var(--gold);
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(243,198,83,0.4);
        }
        #game-over-screen p { color: #94a3b8; font-size: 15px; margin-bottom: 25px; }

        .hand-cards {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            overflow-x: auto;
            max-width: 100%;
            padding: 5px 15px 15px 15px;
        }
        .hand-cards .card { margin-right: -32px; }
        .hand-cards .card:last-child { margin-right: 0; }
        .hand-cards .card:hover, .hand-cards .card:active { margin-right: 10px; }

        .wait-code {
            font-family: 'Cinzel', serif;
            font-size: 40px;
            font-weight: 800;
            color: var(--gold);
            letter-spacing: 8px;
            text-align: center;
            text-shadow: 0 4px 20px rgba(243,198,83,0.4);
        }
        .wait-hint { color: #8da396; font-size: 12px; text-align: center; line-height: 1.5; min-height: 18px; }
        .wait-status { color: #cbd5e1; font-size: 14px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(243,198,83,0.25);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 1120px) {
            body { align-items: flex-start; height: auto; padding: 0; }
            #game-container {
                width: 100vw; height: 100vh; height: 100dvh;
                border-radius: 0; border: none; padding: 12px;
            }
            :root { --card-w: 62px; --card-h: 92px; }
            .card-rank { font-size: 12px; }
            .card-suit { font-size: 11px; }
            .card-center-suit { font-size: 24px; }
            .card { padding: 4px 6px; }
            #bot-zone { height: 110px; }
            #player-zone { height: 130px; }
            #middle-zone { height: calc(100vh - 340px); padding: 5px 12px; gap: 10px; }
            .table-pair { width: 82px; height: var(--card-h); }
            .table-pair .card:nth-child(2) { left: 16px; top: 10px; }
            #deck-info { top: 12px; right: 12px; padding: 6px 10px; gap: 8px; }
            .mini-card-stack { width: 32px; height: 48px; }
            .deck-text { font-size: 11px; }
            .top-left-controls { top: 12px; left: 12px; gap: 6px; }
            .icon-btn { padding: 6px 10px; font-size: 11px; }
            .zone-title { font-size: 9px; padding: 1px 6px; top: -8px; }
            #control-panel { height: 48px; }
            #message-box { font-size: 11px; padding: 6px 10px; }
            .btn { padding: 10px 16px; font-size: 12px; }
            .hand-cards .card { margin-right: -38px; }
            .menu-panel { width: 300px; padding: 20px; }
            .menu-logo { font-size: 38px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="main-menu">
        <div class="menu-logo">ДУРАК</div>
        <div class="menu-subtitle">Премиум Карточная Игра</div>

        <div class="menu-panel" id="menu-panel-default">
            <button class="btn btn-primary" onclick="startBotGame()">🤖 Играть с ботом</button>
            <div class="menu-divider">Онлайн режим (по коду, без ссылок)</div>
            <button class="btn btn-gold" onclick="createOnlineRoom()">✨ Создать комнату</button>
            <div class="room-row">
                <input type="text" id="room-code-input" class="room-input" placeholder="КОД КОМНАТЫ" maxlength="6">
                <button class="btn btn-primary" onclick="joinOnlineRoom()">Войти</button>
            </div>
            <div class="wait-hint">Создайте комнату, продиктуйте другу 6-значный код — он вводит его и жмёт «Войти».</div>
        </div>

        <div class="menu-panel" id="menu-panel-waiting" style="display:none; align-items:center;">
            <div class="wait-code" id="wait-room-code">------</div>
            <div class="wait-status"><span class="spinner"></span><span id="wait-status-text">Ожидаем...</span></div>
            <div class="wait-hint" id="wait-hint-text"></div>
            <button class="btn btn-secondary" onclick="cancelOnlineWait()">Отмена</button>
        </div>
    </div>

    <div class="top-left-controls">
        <button class="icon-btn" id="sound-toggle" onclick="toggleSound()">🔊 Звук</button>
        <button class="icon-btn" onclick="returnToMenu()">🏠 Меню</button>
    </div>

    <div class="zone" id="bot-zone">
        <div class="zone-title" id="bot-title">Противник (Карт: 6)</div>
        <div class="hand-cards" id="bot-cards-container"></div>
    </div>

    <div id="deck-info">
        <div style="position:relative"><div class="mini-card-stack"></div></div>
        <div id="trump-container" style="position:relative; margin-left:4px;"></div>
        <div class="deck-text">
            <span id="trump-label">Козырь: <b>-</b></span>
            <span id="deck-count">В колоде: <b>24</b></span>
        </div>
    </div>

    <div id="middle-zone">
        <div class="zone-title" style="top:-9px; left:15px;">Игровой стол</div>
        <div id="table-pairs-container" style="display: flex; gap: 14px; width: 100%; height: 100%; align-items: center;"></div>
    </div>

    <div id="control-panel">
        <div id="message-box">Загрузка игры...</div>
        <div class="actions">
            <button class="btn btn-danger" id="btn-take" onclick="takeCardsClick()">БЕРУ</button>
            <button class="btn btn-primary" id="btn-done" onclick="finishClick()">ГОТОВО</button>
        </div>
    </div>

    <div class="zone" id="player-zone">
        <div class="zone-title">Ваши карты</div>
        <div class="hand-cards" id="player-cards-container"></div>
    </div>

    <div id="game-over-screen">
        <h1 id="winner-title">ПОБЕДА!</h1>
        <p>Партия завершена. Хотите сыграть еще раз?</p>
        <div style="display: flex; gap: 14px;">
            <button class="btn btn-gold" style="font-size:14px; padding:12px 28px;" onclick="restartGame()">ЕЩЕ РАЗ</button>
            <button class="btn btn-secondary" style="font-size:14px; padding:12px 28px;" onclick="returnToMenu()">В МЕНЮ</button>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* ==================== ЗВУК ==================== */
let soundEnabled = true;
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, type, duration, delay = 0) {
    if (!soundEnabled) return;
    try {
        setTimeout(() => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }, delay);
    } catch(e) {}
}
function soundCardMove() { playTone(340, 'sine', 0.08); }
function soundCardDrop() { playTone(460, 'triangle', 0.12); }
function soundWin() { playTone(523, 'sine', 0.15); playTone(659, 'sine', 0.15, 120); playTone(784, 'sine', 0.3, 240); }
function soundLose() { playTone(280, 'sawtooth', 0.15); playTone(200, 'sawtooth', 0.3, 150); }
function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('sound-toggle').innerHTML = soundEnabled ? "🔊 Звук" : "🔇 Выкл";
}

/* ==================== ОБЩЕЕ ==================== */
const RANKS = [
    {rank: "6", value: 6}, {rank: "7", value: 7}, {rank: "8", value: 8},
    {rank: "9", value: 9}, {rank: "10", value: 10}, {rank: "J", value: 11},
    {rank: "Q", value: 12}, {rank: "K", value: 13}, {rank: "A", value: 14}
];
const SUITS = ["♠", "♥", "♦", "♣"];

let gameMode = 'bot';   // 'bot' | 'online'
let myRole = 'p1';      // используется только в bot-режиме
let onlineCode = null;
let onlineView = null;  // последнее состояние, присланное сервером (online)
let state = null;       // локальное состояние (bot-режим)

const socket = io();

function isRed(suit) { return suit === "♥" || suit === "♦"; }
function renderCardHTML(card, hidden = false) {
    if (hidden) return `<div class="card card-back">♠</div>`;
    const colorClass = isRed(card.suit) ? "red" : "black";
    return `
        <div class="card ${colorClass}">
            <div>
                <div class="card-rank">${card.rank}</div>
                <div class="card-suit">${card.suit}</div>
            </div>
            <div class="card-center-suit">${card.suit}</div>
            <div style="transform: rotate(180deg); text-align: right;">
                <div class="card-rank" style="text-align:right;">${card.rank}</div>
                <div class="card-suit" style="text-align:right;">${card.suit}</div>
            </div>
        </div>
    `;
}

function shuffleArr(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function showWaitingUI() {
    document.getElementById('menu-panel-default').style.display = 'none';
    document.getElementById('menu-panel-waiting').style.display = 'flex';
    document.getElementById('wait-room-code').innerText = onlineCode || '------';
}
function hideWaitingUI() {
    document.getElementById('menu-panel-default').style.display = 'flex';
    document.getElementById('menu-panel-waiting').style.display = 'none';
}
function cancelOnlineWait() {
    socket.emit('leave_room');
    gameMode = 'bot'; onlineCode = null; onlineView = null;
    hideWaitingUI();
}

function returnToMenu() {
    if (gameMode === 'online') socket.emit('leave_room');
    gameMode = 'bot'; onlineCode = null; onlineView = null;
    document.getElementById('main-menu').style.display = 'flex';
    document.getElementById('game-over-screen').style.display = 'none';
    hideWaitingUI();
}

function restartGame() {
    if (gameMode === 'bot') { initGameBot(); }
    else { returnToMenu(); }
}

/* ==================== ОНЛАЙН (через Socket.io) ==================== */
function createOnlineRoom() {
    gameMode = 'online';
    socket.emit('create_room', (res) => {
        if (!res.ok) { alert('Не удалось создать комнату.'); gameMode = 'bot'; return; }
        onlineCode = res.code;
        showWaitingUI();
        document.getElementById('wait-status-text').innerText = 'Комната создана, ждём друга...';
        document.getElementById('wait-hint-text').innerText = 'Продиктуйте этот код другу — он вводит его в поле «Войти»';
    });
}

function joinOnlineRoom() {
    const code = document.getElementById('room-code-input').value.trim().toUpperCase();
    if (!code) { alert('Введите код комнаты!'); return; }
    gameMode = 'online';
    socket.emit('join_room', code, (res) => {
        if (!res.ok) { alert(res.error || 'Не удалось подключиться.'); gameMode = 'bot'; return; }
        onlineCode = res.code;
        showWaitingUI();
        document.getElementById('wait-status-text').innerText = 'Подключено! Ждём начала игры...';
        document.getElementById('wait-hint-text').innerText = '';
    });
}

socket.on('state', (view) => {
    onlineView = view;
    if (view.status === 'waiting') {
        showWaitingUI();
        document.getElementById('wait-status-text').innerText = 'Ожидаем второго игрока...';
        return;
    }
    if (view.status === 'playing') {
        hideWaitingUI();
        document.getElementById('main-menu').style.display = 'none';
        renderOnline(view);
    }
});

socket.on('opponent_left', () => {
    alert('Соперник покинул игру.');
    returnToMenu();
});

function isMyTurnOnline(view) {
    const role = (view.phase === 'ATTACK' || view.phase === 'THROW') ? view.attacker
               : (view.phase === 'DEFEND' ? view.defender : null);
    return role === view.myRole;
}
function computeMessageOnline(view) {
    if (view.gameOver) return '';
    const mine = isMyTurnOnline(view);
    if (view.phase === 'ATTACK') return mine ? 'Ваш ход: выберите карту для атаки' : 'Ход соперника...';
    if (view.phase === 'DEFEND') return mine ? 'Отбейте карту' : 'Соперник отбивается...';
    if (view.phase === 'THROW') return mine ? 'Подкиньте карту или нажмите «Готово»' : 'Соперник решает...';
    return '';
}

function renderOnline(view) {
    document.getElementById('deck-count').innerHTML = `В колоде: <b>${view.deckCount}</b>`;
    const trumpCont = document.getElementById('trump-container');
    const isMobile = window.innerWidth <= 1120;
    const tScale = isMobile ? 0.38 : 0.52, tTop = isMobile ? -22 : -28;
    if (view.trumpCard) {
        trumpCont.innerHTML = `<div style="position:absolute; top:${tTop}px; left:-2px; transform: rotate(90deg) scale(${tScale}); transform-origin: top left;">${renderCardHTML(view.trumpCard)}</div>`;
        document.getElementById('trump-label').innerHTML = `Козырь: <b>${view.trumpCard.rank}${view.trumpCard.suit}</b>`;
    } else {
        trumpCont.innerHTML = '';
        document.getElementById('trump-label').innerHTML = `Козырь: <b>${view.trumpSuit || '-'}</b>`;
    }
    document.getElementById('table-pairs-container').innerHTML = (view.table || []).map(pair => `
        <div class="table-pair">${renderCardHTML(pair.attack)}${pair.defense ? renderCardHTML(pair.defense) : ''}</div>
    `).join('');
    document.getElementById('bot-cards-container').innerHTML = Array.from({ length: view.oppCount }).map(() => renderCardHTML(null, true)).join('');
    document.getElementById('bot-title').innerText = `Соперник (Карт: ${view.oppCount})`;
    document.getElementById('player-cards-container').innerHTML = (view.myHand || []).map(card => `
        <div onclick="clickCardOnline(${card.id})">${renderCardHTML(card, false)}</div>
    `).join('');
    document.getElementById('message-box').innerText = computeMessageOnline(view);

    const allCov = (view.table || []).length > 0 && view.table.every(p => p.defense !== null);
    document.getElementById('btn-take').disabled = !(view.defender === view.myRole && view.phase === 'DEFEND' && view.table.length > 0);
    document.getElementById('btn-done').disabled = !(view.attacker === view.myRole && view.phase === 'THROW' && allCov && view.table.length > 0);

    if (view.gameOver) {
        document.getElementById('game-over-screen').style.display = 'flex';
        const winText = view.winner === 'draw' ? 'НИЧЬЯ' : (view.winner === view.myRole ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ');
        document.getElementById('winner-title').innerText = winText;
        if (view.winner === view.myRole) soundWin(); else if (view.winner !== 'draw') soundLose();
    } else {
        document.getElementById('game-over-screen').style.display = 'none';
    }
}

function clickCardOnline(cardId) {
    if (!onlineView || onlineView.gameOver || !isMyTurnOnline(onlineView)) return;
    if (onlineView.phase === 'ATTACK' || onlineView.phase === 'THROW') socket.emit('attack_card', cardId);
    else if (onlineView.phase === 'DEFEND') socket.emit('defend_card', cardId);
    soundCardDrop();
}

/* ==================== БОТ-РЕЖИМ (полностью локально, без сервера) ==================== */
function startBotGame() {
    gameMode = 'bot';
    myRole = 'p1';
    document.getElementById('main-menu').style.display = 'none';
    initGameBot();
}

function sortHand(hand) {
    hand.sort((a, b) => {
        const aTr = a.suit === state.trumpSuit ? 1 : 0;
        const bTr = b.suit === state.trumpSuit ? 1 : 0;
        if (aTr !== bTr) return aTr - bTr;
        return a.value - b.value;
    });
}
function chooseFirstAttackerGeneric() {
    const p1T = state.hands.p1.filter(c => c.suit === state.trumpSuit);
    const p2T = state.hands.p2.filter(c => c.suit === state.trumpSuit);
    const p1Min = p1T.length ? Math.min(...p1T.map(c => c.value)) : null;
    const p2Min = p2T.length ? Math.min(...p2T.map(c => c.value)) : null;
    if (p1Min !== null && p2Min !== null) {
        state.attacker = p1Min < p2Min ? 'p1' : (p2Min < p1Min ? 'p2' : (Math.random() < 0.5 ? 'p1' : 'p2'));
    } else if (p1Min !== null) state.attacker = 'p1';
    else if (p2Min !== null) state.attacker = 'p2';
    else state.attacker = Math.random() < 0.5 ? 'p1' : 'p2';
}
function initGameBot() {
    const deck = [];
    let id = 0;
    for (const s of SUITS) for (const r of RANKS) deck.push({ id: id++, suit: s, rank: r.rank, value: r.value });
    shuffleArr(deck);
    state = {
        deck, hands: { p1: [], p2: [] }, table: [],
        trumpCard: null, trumpSuit: '', attacker: '', defender: '',
        phase: 'ATTACK', gameOver: false, winner: null, startedRoundCards: 0
    };
    state.trumpCard = state.deck[0];
    state.trumpSuit = state.trumpCard.suit;
    for (let i = 0; i < 6; i++) {
        if (state.deck.length) state.hands.p1.push(state.deck.pop());
        if (state.deck.length) state.hands.p2.push(state.deck.pop());
    }
    sortHand(state.hands.p1);
    sortHand(state.hands.p2);
    chooseFirstAttackerGeneric();
    state.defender = state.attacker === 'p1' ? 'p2' : 'p1';
    state.startedRoundCards = state.hands[state.defender].length;
    document.getElementById('game-over-screen').style.display = 'none';
    soundCardMove();
    render();
    if (actingRole() === 'p2') setTimeout(botAI, 700);
}
function actingRole() {
    if (state.phase === 'ATTACK' || state.phase === 'THROW') return state.attacker;
    if (state.phase === 'DEFEND') return state.defender;
    return null;
}
function isMyTurn() { return actingRole() === myRole; }
function canBeat(att, def) {
    const aTr = att.suit === state.trumpSuit, dTr = def.suit === state.trumpSuit;
    if (aTr && !dTr) return false;
    if (aTr && dTr) return def.value > att.value;
    if (!dTr) return att.suit === def.suit && def.value > att.value;
    return true;
}
function getTableRanks() {
    const ranks = new Set();
    for (const p of state.table) { ranks.add(p.rank); if (p.defense) ranks.add(p.defense.rank); }
    return ranks;
}
function allCovered() { return state.table.length > 0 && state.table.every(p => p.defense !== null); }
function firstUncoveredIndex() { return state.table.findIndex(p => p.defense === null); }
function commitChange() {
    checkWinner();
    render();
    if (!state.gameOver && actingRole() === 'p2') setTimeout(botAI, 650);
}
function drawCardsGeneric(oldAtt) {
    const oldDef = oldAtt === 'p1' ? 'p2' : 'p1';
    for (const role of [oldAtt, oldDef]) {
        while (state.hands[role].length < 6 && state.deck.length > 0) state.hands[role].push(state.deck.pop());
        sortHand(state.hands[role]);
    }
}
function checkWinner() {
    if (state.deck.length > 0) return false;
    const p1E = state.hands.p1.length === 0, p2E = state.hands.p2.length === 0;
    if (p1E && p2E) { state.winner = 'draw'; state.gameOver = true; return true; }
    if (p1E) { state.winner = 'p1'; state.gameOver = true; return true; }
    if (p2E) { state.winner = 'p2'; state.gameOver = true; return true; }
    return false;
}
function startRoundGeneric() {
    state.table = [];
    state.defender = state.attacker === 'p1' ? 'p2' : 'p1';
    state.startedRoundCards = state.hands[state.defender].length;
    state.phase = 'ATTACK';
}
function doTake() {
    const def = state.defender;
    for (const p of state.table) { state.hands[def].push(p.attack); if (p.defense) state.hands[def].push(p.defense); }
    state.table = [];
    sortHand(state.hands[def]);
    soundCardMove();
    const oldAtt = state.attacker;
    drawCardsGeneric(oldAtt);
    if (checkWinner()) { commitChange(); return; }
    state.attacker = oldAtt;
    startRoundGeneric();
    commitChange();
}
function doFinish() {
    const oldDef = state.defender;
    state.table = [];
    const oldAtt = state.attacker;
    drawCardsGeneric(oldAtt);
    if (checkWinner()) { commitChange(); return; }
    state.attacker = oldDef;
    startRoundGeneric();
    commitChange();
}
function clickCard(idx) {
    if (!state || state.gameOver || !isMyTurn()) return;
    const myHand = state.hands[myRole];
    const card = myHand[idx];
    if (!card) return;
    if ((state.phase === 'ATTACK' || state.phase === 'THROW') && state.attacker === myRole) {
        if (state.table.length > 0 && state.table.length >= Math.min(6, state.startedRoundCards)) { flashMsg('Достигнут лимит карт в раунде'); return; }
        if (state.table.length > 0 && !getTableRanks().has(card.rank)) { flashMsg('Такую карту нельзя подкинуть'); return; }
        myHand.splice(idx, 1);
        state.table.push({ attack: card, defense: null, rank: card.rank });
        state.phase = 'DEFEND';
        soundCardDrop();
        commitChange();
    } else if (state.phase === 'DEFEND' && state.defender === myRole) {
        const uIdx = firstUncoveredIndex();
        if (uIdx === -1) return;
        const attCard = state.table[uIdx].attack;
        if (!canBeat(attCard, card)) { flashMsg('Эта карта не может побить ' + attCard.rank + attCard.suit); return; }
        myHand.splice(idx, 1);
        state.table[uIdx].defense = card;
        soundCardDrop();
        if (allCovered()) state.phase = 'THROW';
        commitChange();
    }
}
function flashMsg(text) {
    const box = document.getElementById('message-box');
    if (box) box.innerText = text;
}
function botAI() {
    if (!state || state.gameOver) return;
    const role = actingRole();
    if (role !== 'p2') return;
    if (state.phase === 'DEFEND') {
        const uIdx = firstUncoveredIndex();
        if (uIdx === -1) return;
        const attCard = state.table[uIdx].attack;
        let possible = state.hands.p2.filter(c => canBeat(attCard, c));
        if (!possible.length) { doTake(); return; }
        possible.sort((a, b) => ((a.suit === state.trumpSuit ? 1 : 0) - (b.suit === state.trumpSuit ? 1 : 0)) || (a.value - b.value));
        const defCard = possible[0];
        state.hands.p2 = state.hands.p2.filter(c => c.id !== defCard.id);
        state.table[uIdx].defense = defCard;
        soundCardDrop();
        if (allCovered()) state.phase = 'THROW';
        commitChange();
    } else if (state.phase === 'ATTACK' || state.phase === 'THROW') {
        if (state.table.length === 0) {
            let possible = [...state.hands.p2];
            possible.sort((a, b) => ((a.suit === state.trumpSuit ? 1 : 0) - (b.suit === state.trumpSuit ? 1 : 0)) || (a.value - b.value));
            const card = possible[0];
            state.hands.p2 = state.hands.p2.filter(c => c.id !== card.id);
            state.table.push({ attack: card, defense: null, rank: card.rank });
            state.phase = 'DEFEND';
            soundCardDrop();
            commitChange();
        } else {
            const tRanks = getTableRanks();
            let possible = state.hands.p2.filter(c => tRanks.has(c.rank));
            if (possible.length && state.table.length < Math.min(6, state.startedRoundCards)) {
                possible.sort((a, b) => ((a.suit === state.trumpSuit ? 1 : 0) - (b.suit === state.trumpSuit ? 1 : 0)) || (a.value - b.value));
                const card = possible[0];
                state.hands.p2 = state.hands.p2.filter(c => c.id !== card.id);
                state.table.push({ attack: card, defense: null, rank: card.rank });
                state.phase = 'DEFEND';
                soundCardDrop();
                commitChange();
            } else {
                doFinish();
            }
        }
    }
}
function computeMessage() {
    if (!state) return '';
    if (state.gameOver) return '';
    const mine = isMyTurn();
    if (state.phase === 'ATTACK') return mine ? 'Ваш ход: выберите карту для атаки' : 'Бот думает над атакой...';
    if (state.phase === 'DEFEND') return mine ? 'Отбейте карту' : 'Бот отбивается...';
    if (state.phase === 'THROW') return mine ? 'Подкиньте карту или нажмите «Готово»' : 'Бот думает...';
    return '';
}
function render() {
    if (!state || !state.hands) return;
    const oppRole = myRole === 'p1' ? 'p2' : 'p1';
    document.getElementById('deck-count').innerHTML = `В колоде: <b>${state.deck.length}</b>`;
    const trumpCont = document.getElementById('trump-container');
    const isMobile = window.innerWidth <= 1120;
    const tScale = isMobile ? 0.38 : 0.52, tTop = isMobile ? -22 : -28;
    if (state.trumpCard) {
        trumpCont.innerHTML = `<div style="position:absolute; top:${tTop}px; left:-2px; transform: rotate(90deg) scale(${tScale}); transform-origin: top left;">${renderCardHTML(state.trumpCard)}</div>`;
        document.getElementById('trump-label').innerHTML = `Козырь: <b>${state.trumpCard.rank}${state.trumpCard.suit}</b>`;
    } else {
        trumpCont.innerHTML = "";
        document.getElementById('trump-label').innerHTML = `Козырь: <b>${state.trumpSuit}</b>`;
    }
    document.getElementById('table-pairs-container').innerHTML = state.table.map(pair => `
        <div class="table-pair">${renderCardHTML(pair.attack)}${pair.defense ? renderCardHTML(pair.defense) : ''}</div>
    `).join('');
    document.getElementById('bot-cards-container').innerHTML = state.hands[oppRole].map(() => renderCardHTML(null, true)).join('');
    document.getElementById('bot-title').innerText = `Противник (Карт: ${state.hands[oppRole].length})`;
    document.getElementById('player-cards-container').innerHTML = state.hands[myRole].map((card, idx) => `
        <div onclick="clickCard(${idx})">${renderCardHTML(card, false)}</div>
    `).join('');
    document.getElementById('message-box').innerText = computeMessage();
    document.getElementById('btn-take').disabled = !(state.defender === myRole && state.phase === 'DEFEND' && state.table.length > 0);
    document.getElementById('btn-done').disabled = !(state.attacker === myRole && state.phase === 'THROW' && allCovered() && state.table.length > 0);
    if (state.gameOver) {
        document.getElementById('game-over-screen').style.display = 'flex';
        const winText = state.winner === 'draw' ? 'НИЧЬЯ' : (state.winner === myRole ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ');
        document.getElementById('winner-title').innerText = winText;
        if (state.winner === myRole) soundWin(); else if (state.winner !== 'draw') soundLose();
    }
}

/* ==================== ОБЩИЕ КНОПКИ (БЕРУ / ГОТОВО) ==================== */
function takeCardsClick() {
    if (gameMode === 'online') {
        if (onlineView && onlineView.defender === onlineView.myRole && onlineView.phase === 'DEFEND' && onlineView.table.length > 0) {
            socket.emit('take_cards'); soundCardMove();
        }
        return;
    }
    if (state && state.defender === myRole && state.phase === 'DEFEND' && state.table.length > 0) doTake();
}
function finishClick() {
    if (gameMode === 'online') {
        const allCov = onlineView && onlineView.table.length > 0 && onlineView.table.every(p => p.defense !== null);
        if (onlineView && onlineView.attacker === onlineView.myRole && onlineView.phase === 'THROW' && allCov) {
            socket.emit('finish_attack');
        }
        return;
    }
    if (state && state.attacker === myRole && state.phase === 'THROW' && allCovered() && state.table.length > 0) doFinish();
}
