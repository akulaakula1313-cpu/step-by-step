<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточная игра: Дурак Онлайн</title>
    <style>
        :root {
            --bg-color: #121814;
            --felt-green: #1b382b;
            --felt-dark: #12261d;
            --gold: #f3c653;
            --gold-hover: #e0b23d;
            --panel-bg: rgba(18, 38, 29, 0.92);
            --text-light: #e0e8e3;
            --accent-red: #e63946;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        #main-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1e4231 0%, #0d1f17 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .menu-card {
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .menu-card h1 {
            color: var(--gold);
            margin-bottom: 20px;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .section-title {
            font-size: 13px;
            color: #8da396;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .player-counts {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .count-btn {
            flex: 1;
            padding: 10px 0;
            background: #234737;
            color: var(--text-light);
            border: 1px solid #34614c;
        }

        .count-btn.active {
            background: var(--gold);
            color: #121814;
            border-color: var(--gold);
        }

        .menu-btn {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: #121814;
            font-size: 15px;
            margin-bottom: 12px;
        }
        .menu-btn:hover { background: var(--gold-hover); }

        .menu-btn-secondary {
            background: #234737;
            color: var(--text-light);
            border: 1px solid #34614c;
        }
        .menu-btn-secondary:hover { background: #2b5643; }

        .join-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .join-row input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #34614c;
            background: #12261d;
            color: white;
            text-align: center;
            font-size: 16px;
            text-transform: uppercase;
        }
        .join-row input:focus { outline: 1px solid var(--gold); }

        #menu-status {
            font-size: 13px;
            color: #f3c653;
            min-height: 18px;
            margin-top: 10px;
        }

        #game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: radial-gradient(circle, var(--felt-green) 0%, var(--felt-dark) 100%);
            position: relative;
            padding: 10px;
            height: 100vh;
        }

        #opponents-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            min-height: 80px;
        }

        .opponent-box {
            background: rgba(10, 24, 18, 0.7);
            border: 1px solid #284c3b;
            border-radius: 8px;
            padding: 8px 12px;
            min-width: 130px;
            text-align: center;
        }
        .opponent-box.active-turn {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(243, 198, 83, 0.3);
        }
        .opp-name {
            font-size: 12px;
            margin-bottom: 5px;
            color: #b2c9bd;
        }
        .opp-cards {
            display: flex;
            gap: 2px;
            justify-content: center;
        }
        .mini-card {
            width: 14px;
            height: 20px;
            background: #b93838;
            border: 1px solid #fff;
            border-radius: 2px;
        }

        .center-table-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex: 1;
            margin: 5px 0;
        }

        .deck-area {
            position: relative;
            width: 70px;
            height: 95px;
            background: #a83232;
            border: 2px solid #fff;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.4);
        }
        #deck-count {
            font-size: 11px;
            background: rgba(0,0,0,0.6);
            padding: 2px 4px;
            border-radius: 4px;
            margin-top: 25px;
        }

        #table-pairs-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            max-width: 600px;
            min-height: 100px;
            background: rgba(0,0,0,0.15);
            border-radius: 10px;
            padding: 10px;
            align-items: center;
            justify-content: center;
        }

        .table-pair {
            position: relative;
            width: 75px;
            height: 105px;
        }
        .table-pair .card:nth-child(2) {
            position: absolute;
            top: 15px;
            left: 12px;
        }

        .card {
            width: 70px;
            height: 98px;
            background: #fff;
            border-radius: 6px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .card.red { color: #d32f2f; }
        .card.black { color: #212121; }
        .card-center-suit {
            font-size: 22px;
            text-align: center;
        }

        .player-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #player-cards-container {
            display: flex;
            justify-content: center;
            min-height: 105px;
            perspective: 500px;
        }

        .hand-card-wrap {
            transition: transform 0.2s;
            cursor: pointer;
        }
        .hand-card-wrap:hover {
            transform: translateY(-15px);
        }

        .action-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 5px;
        }
        .action-btn {
            padding: 8px 16px;
            background: #234737;
            color: white;
            border: 1px solid #3c7058;
            font-size: 13px;
        }
        .action-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }
        .action-btn.primary {
            background: var(--gold);
            color: #121814;
            border: none;
        }

        #message-box {
            font-size: 13px;
            color: var(--gold);
            min-height: 18px;
            text-align: center;
        }
        #message-box.error { color: var(--accent-red); }

        .top-utility-bar {
            position: absolute;
            top: 10px;
            right: 15px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .util-btn {
            background: rgba(18, 38, 29, 0.8);
            border: 1px solid var(--gold);
            color: var(--text-light);
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
        }

        #chat-panel {
            position: fixed;
            bottom: 60px;
            right: 15px;
            width: 280px;
            height: 220px;
            background: rgba(14, 29, 22, 0.95);
            border: 1px solid var(--gold);
            border-radius: 8px;
            display: none;
            flex-direction: column;
            z-index: 50;
        }
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-msg { word-break: break-all; }
        .chat-input-area {
            display: flex;
            border-top: 1px solid #234737;
        }
        #chat-input-field {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px;
            color: white;
            font-size: 11px;
        }
        #chat-input-field:focus { outline: none; }
        .chat-send-btn {
            background: var(--gold);
            color: #121814;
            padding: 0 12px;
            font-size: 11px;
            border-radius: 0;
        }

        #game-over-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        #winner-title {
            font-size: 32px;
            color: var(--gold);
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div class="top-utility-bar">
        <button id="music-btn" class="util-btn" onclick="toggleMusic()">🎵 Музыка</button>
        <button id="chat-toggle-btn" class="util-btn" onclick="toggleChat()">💬 Чат</button>
    </div>

    <div id="main-menu">
        <div class="menu-card">
            <h1>ДУРАК ОНЛАЙН</h1>
            
            <div class="section-title">Количество игроков</div>
            <div class="player-counts">
                <button class="count-btn active" onclick="selectCount(2)">2</button>
                <button class="count-btn" onclick="selectCount(3)">3</button>
                <button class="count-btn" onclick="selectCount(4)">4</button>
            </div>

            <button class="menu-btn" onclick="createRoom()">Создать комнату</button>
            
            <div class="join-row">
                <input type="text" id="room-code-input" placeholder="КОД КОМНАТЫ" maxlength="6">
                <button class="menu-btn menu-btn-secondary" style="width: auto; margin-bottom: 0;" onclick="joinRoom()">Войти</button>
            </div>

            <button class="menu-btn menu-btn-secondary" onclick="playWithBots()">Играть с ботами</button>
            
            <div id="menu-status"></div>
        </div>
    </div>

    <div id="game-container">
        <div id="opponents-container"></div>

        <div class="center-table-area">
            <div class="deck-area">
                <div id="trump-container" style="position: absolute; top:0; left:0;"></div>
                <div id="deck-count">Колода: <b>0</b></div>
            </div>
            <div id="table-pairs-container">
                <div style="color: #698275; font-size: 11px; margin: auto;">Ожидание...</div>
            </div>
        </div>

        <div class="player-zone">
            <div id="message-box"></div>
            <div class="action-controls">
                <button id="btn-take" class="action-btn" onclick="sendAction('take')" disabled>Беру</button>
                <button id="btn-done" class="action-btn primary" onclick="sendAction('done')" disabled>Бито</button>
            </div>
            <div id="player-cards-container"></div>
            <div id="trump-label" style="font-size: 11px; color: #8da396; margin-bottom: 2px;">Козырь: -</div>
        </div>
    </div>

    <div id="chat-panel">
        <div id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input-field" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendChatMessage()">
            <button class="chat-send-btn" onclick="sendChatMessage()">Отпр</button>
        </div>
    </div>

    <div id="game-over-screen">
        <div id="winner-title">ИГРА ОКОНЧЕНА</div>
        <div style="font-size: 13px; color: #8da396;">Голосов за реванш: <span id="votes-count">0/2</span> (Осталось: <span id="timer-sec">15</span>с)</div>
        <button id="btn-rematch" class="menu-btn" style="max-width: 250px;" onclick="voteRematch()">🔄 Играть снова за столом</button>
    </div>

    <script>
        const socket = io();
        let selectedMaxPlayers = 2;
        let currentRoomCode = null;
        let gameState = null;
        
        const bgMusic = new Audio('https://google.com');
        bgMusic.loop = true;
        bgMusic.volume = 0.3;
        let musicEnabled = true;
        let userInteracted = false;

        document.addEventListener('click', () => { userInteracted = true; }, { once: true });

        function toggleMusic() {
            musicEnabled = !musicEnabled;
            const btn = document.getElementById('music-btn');
            if (musicEnabled) {
                btn.innerText = "🎵 Музыка";
                if (gameState && !gameState.isGameOver) bgMusic.play().catch(() => {});
            } else {
                btn.innerText = "🔇 Музыка";
                bgMusic.pause();
            }
        }

        function toggleChat() {
            const panel = document.getElementById('chat-panel');
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
            if (panel.style.display === 'flex') {
                document.getElementById('chat-input-field').focus();
                let msgBox = document.getElementById('chat-messages');
                msgBox.scrollTop = msgBox.scrollHeight;
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input-field');
            const text = input.value.trim();
            if (!text || !currentRoomCode) return;
            socket.emit('send_message', { roomCode: currentRoomCode, message: text });
            input.value = '';
        }

        socket.on('chat_message', (data) => {
            const msgContainer = document.getElementById('chat-messages');
            const isMe = data.senderId === socket.id;
            const nameColor = isMe ? "#f3c653" : "#3a86ef";
            
            msgContainer.innerHTML += `<div class="chat-msg"><b style="color: ${nameColor};">${data.senderName}:</b> ${escapeHtml(data.message)}</div>`;
            msgContainer.scrollTop = msgContainer.scrollHeight;
            
            const chatBtn = document.getElementById('chat-toggle-btn');
            if (document.getElementById('chat-panel').style.display !== 'flex') {
                chatBtn.style.borderColor = '#e63946';
                setTimeout(() => chatBtn.style.borderColor = 'var(--gold)', 1500);
            }
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        socket.on('play_music', () => {
            if (!musicEnabled) return;
            bgMusic.currentTime = 0;
            if (userInteracted) bgMusic.play().catch(() => {});
        });
        socket.on('game_over', (data) => { 
            bgMusic.pause(); 
            bgMusic.currentTime = 0;
            document.getElementById('game-over-screen').style.display = 'flex';
            let isWinner = data.winner === socket.id;
            document.getElementById('winner-title').innerText = isWinner ? "ПОБЕДА!" : (data.winner ? "ВЫ ПРОИГРАЛИ" : "НИЧЬЯ!");
            document.getElementById('btn-rematch').disabled = false;
            document.getElementById('btn-rematch').innerText = "🔄 Играть снова за столом";
        });
        socket.on('room_expired', () => { bgMusic.pause(); });

        function selectCount(num) {
            selectedMaxPlayers = num;
            document.querySelectorAll('.count-btn').forEach(btn => { 
                btn.classList.toggle('active', btn.innerText == num); 
            });
        }

        function setMenuStatus(text) { document.getElementById('menu-status').innerText = text; }

        function showMessage(text, isError = false) {
            let msgBox = document.getElementById('message-box');
            msgBox.innerText = text;
            if (isError) { 
                msgBox.classList.add('error'); 
                setTimeout(() => msgBox.classList.remove('error'), 3000); 
            }
        }

        function playWithBots() { 
            setMenuStatus("Запуск...");
            socket.emit('play_with_bots', selectedMaxPlayers);
        }

        function createRoom() { 
            setMenuStatus("Создание...");
            socket.emit('create_room', selectedMaxPlayers);
        }

        function joinRoom() {
            let code = document.getElementById('room-code-input').value.trim().toUpperCase();
            if (!code) { setMenuStatus("Введите код!"); return; }
            setMenuStatus("Подключение...");
            currentRoomCode = code;
            socket.emit('join_room', code);
        }

        socket.on('room_created', (data) => { 
            currentRoomCode = data.code;
            document.getElementById('main-menu').style.display = 'none';
            showMessage(`Комната: ${data.code}. Ожидание (1/${data.maxPlayers})`);
        });

        socket.on('lobby_update', (data) => { 
            currentRoomCode = data.code;
            document.getElementById('main-menu').style.display = 'none';
            showMessage(`Комната: ${data.code}. Игроков: ${data.current}/${data.max}`);
        });

        socket.on('error_msg', (msg) => { setMenuStatus(msg); showMessage(msg, true); });
        socket.on('opponent_disconnected', () => { alert("Соперник покинул игру."); location.reload(); });
        socket.on('room_expired', () => { alert("Время ожидания реванша истекло."); location.reload(); });

        socket.on('game_update', (state) => {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            gameState = state;
            if (state.roomCode) currentRoomCode = state.roomCode;
            render();
        });

        socket.on('rematch_timer', (sec) => { document.getElementById('timer-sec').innerText = sec; });
        socket.on('rematch_voted', (data) => { document.getElementById('votes-count').innerText = `${data.votesCount}/${data.totalNeeded}`; });
        
        socket.on('game_restarted', () => {
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('btn-rematch').disabled = false;
            document.getElementById('btn-rematch').innerText = "🔄 Играть снова за столом";
            document.getElementById('chat-messages').innerHTML += `<div class="chat-msg" style="text-align:center; color:#8da396;">--- Новая раздача ---</div>`;
        });

        function voteRematch() {
            document.getElementById('btn-rematch').disabled = true;
            document.getElementById('btn-rematch').innerText = "Ожидание других игроков...";
            if (currentRoomCode) socket.emit('vote_rematch', currentRoomCode);
        }

        function isRed(suit) { return suit === "♥" || suit === "♦"; }

        function renderCardHTML(card) {
            if (!card || !card.rank) return '';
            let colorClass = isRed(card.suit) ? "red" : "black";
            return `<div class="card ${colorClass}">
              <div><div class="card-rank">${card.rank}</div><div class="card-suit">${card.suit}</div></div>
              <div class="card-center-suit">${card.suit}</div>
              <div style="transform: rotate(180deg); text-align: right;"><div class="card-rank" style="text-align:right;">${card.rank}</div><div class="card-suit" style="text-align:right;">${card.suit}</div></div>
            </div>`;
        }

        function render() {
            if (!gameState) return;
            let myId = socket.id;
            let playersInfo = gameState.playersInfo || [];
            let myHand = (gameState.hands && gameState.hands[myId]) ? gameState.hands[myId] : [];
            
            let oppContainer = document.getElementById('opponents-container');
            if (oppContainer) {
                oppContainer.innerHTML = "";
                playersInfo.forEach((p) => {
                    if (p.id === myId) return;
                    let count = (gameState.hands && gameState.hands[p.id]) ? gameState.hands[p.id].length : 0;
                    let isAtt = playersInfo[gameState.attackerIdx] && playersInfo[gameState.attackerIdx].id === p.id;
                    let isDef = playersInfo[gameState.defenderIdx] && playersInfo[gameState.defenderIdx].id === p.id;
                    let roleText = isAtt ? "⚔️ Атака" : (isDef ? "🛡️ Защита" : "⏳ Ждет");
                    let miniCardsHTML = Array(count).fill(0).map(() => `<div class="mini-card"></div>`).join('');
                    oppContainer.innerHTML += `<div class="opponent-box ${isAtt || isDef ? 'active-turn' : ''}"><div class="opp-name">${p.name} (${count}) • ${roleText}</div><div class="opp-cards">${miniCardsHTML}</div></div>`;
                });
            }

            let deckCountEl = document.getElementById('deck-count');
            if (deckCountEl) deckCountEl.innerHTML = `В колоде: <b>${(gameState.deck || []).length}</b>`;

            let trumpCont = document.getElementById('trump-container');
            let trumpLabel = document.getElementById('trump-label');
            if (gameState.trumpCard && gameState.trumpCard.rank) {
                if (trumpCont) trumpCont.innerHTML = `<div style="position:absolute; top:-16px; left:-2px; transform: rotate(90deg) scale(0.28); transform-origin: top left;">${renderCardHTML(gameState.trumpCard)}</div>`;
                if (trumpLabel) trumpLabel.innerHTML = `Козырь: <b>${gameState.trumpCard.rank}${gameState.trumpCard.suit}</b>`;
            } else {
                if (trumpCont) trumpCont.innerHTML = "";
                if (trumpLabel) trumpLabel.innerHTML = `Козырь: <b>${gameState.trumpSuit || '-'}</b>`;
            }

            let tablePairsCont = document.getElementById('table-pairs-container');
            if (tablePairsCont) {
                if (!gameState.table || gameState.table.length === 0) {
                    tablePairsCont.innerHTML = `<div style="color: #698275; font-size: 11px; margin: auto;">Ожидание...</div>`;
                } else {
                    tablePairsCont.innerHTML = gameState.table.map(p => `<div class="table-pair">${renderCardHTML(p.attack)}${p.defense ? renderCardHTML(p.defense) : ''}</div>`).join('');
                }
            }

            let handContainer = document.getElementById('player-cards-container');
            if (handContainer) {
                let cardCount = myHand.length;
                let cardW = window.innerWidth < 768 ? 70 : 80;
                let availableWidth = Math.min(window.innerWidth - 40, 750);
                let dynamicMargin = cardCount > 1 ? Math.min(-15, Math.floor((availableWidth - (cardCount * cardW)) / (cardCount - 1))) : 0;
                if (dynamicMargin > 5) dynamicMargin = 5;
                handContainer.innerHTML = myHand.map((card, idx) => `<div class="hand-card-wrap" style="margin-right: ${idx === cardCount - 1 ? 0 : dynamicMargin}px; z-index: ${idx};" onclick="playCard(${idx})"> ${renderCardHTML(card)} </div>`).join('');
            }

            let isAttacker = playersInfo[gameState.attackerIdx] && playersInfo[gameState.attackerIdx].id === myId;
            let isDefender = playersInfo[gameState.defenderIdx] && playersInfo[gameState.defenderIdx].id === myId;
            if (isDefender) {
                showMessage("Вы защищаетесь!");
            } else if (isAttacker || (gameState.table && gameState.table.length > 0)) {
                showMessage("Ваш ход / Подкидывание");
            } else {
                showMessage("Ход соперника...");
            }

            let allCovered = gameState.table && gameState.table.length > 0 && gameState.table.every(p => p.defense !== null);
            let btnTake = document.getElementById('btn-take');
            let btnDone = document.getElementById('btn-done');
            if (btnTake) btnTake.disabled = !isDefender || !gameState.table || gameState.table.length === 0;
            if (btnDone) btnDone.disabled = !gameState.table || gameState.table.length === 0 || !allCovered || !isAttacker;
        }

        function playCard(cardIdx) {
            if (!currentRoomCode) { showMessage("Ошибка комнаты", true); return; }
            socket.emit('player_action', { roomCode: currentRoomCode, action: 'play_card', cardIdx });
        }

        function sendAction(action) {
            if (!currentRoomCode) return;
            socket.emit('player_action', { roomCode: currentRoomCode, action });
        }
    </script>
</body>
</html>
