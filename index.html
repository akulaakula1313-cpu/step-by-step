<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дурак — карточная игра</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root{
    --felt:#0b6b3a;
    --felt-dark:#054a27;
    --gold:#e8c14a;
    --red:#c62828;
    --black:#1b1b1b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',Roboto,Arial,sans-serif;
    background:radial-gradient(circle at center, var(--felt) 0%, var(--felt-dark) 100%);
    height:100vh; overflow:hidden; color:#fff;
  }
  #menu{
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px;
    background:radial-gradient(circle at center, var(--felt) 0%, var(--felt-dark) 100%);
    z-index:50;
  }
  #menu h1{ font-size:2.4em; margin:0; text-shadow:2px 2px 4px #000; letter-spacing:2px;}
  .menu-card{
    background:rgba(0,0,0,0.35); padding:24px 32px; border-radius:16px;
    border:1px solid rgba(255,255,255,0.15); display:flex; flex-direction:column; gap:12px;
    min-width:280px;
  }
  .menu-card label{font-size:0.9em; opacity:0.85;}
  select, input[type=text]{
    padding:8px 10px; border-radius:8px; border:none; font-size:1em;
  }
  button{
    cursor:pointer; border:none; border-radius:10px; padding:10px 18px;
    font-size:1em; font-weight:600; transition:transform .1s ease, box-shadow .1s ease;
  }
  button:active{transform:scale(0.96);}
  .btn-primary{ background:var(--gold); color:#3a2a00; box-shadow:0 3px 0 #a9862c;}
  .btn-secondary{ background:#3a7bd5; color:#fff; box-shadow:0 3px 0 #244f8c;}
  .btn-danger{ background:var(--red); color:#fff; box-shadow:0 3px 0 #7a1414;}
  .btn-yellow{ background:var(--gold); color:#3a2a00; box-shadow:0 3px 0 #a9862c;}
  .btn-blue{ background:#3a7bd5; color:#fff; box-shadow:0 3px 0 #244f8c;}
  .row{display:flex; gap:10px;}
  hr.sep{width:100%; border:none; border-top:1px solid rgba(255,255,255,0.2); margin:6px 0;}

  #game{ position:fixed; inset:0; display:none; }
  #topbar{
    position:absolute; top:8px; left:0; right:0; display:flex; justify-content:center;
    gap:16px; font-size:0.85em; opacity:0.9; z-index:10;
  }
  #logbox{
    position:absolute; top:36px; left:10px; width:230px; max-height:130px; overflow-y:auto;
    background:rgba(0,0,0,0.35); border-radius:10px; padding:8px 10px; font-size:0.78em; line-height:1.4em;
    z-index:10;
  }
  #deckArea{
    position:absolute; top:50%; left:60px; transform:translateY(-50%);
    display:flex; flex-direction:column; align-items:center; gap:8px; z-index:5;
  }
  #deckCount{font-size:0.8em; opacity:0.85;}
  .card{
    width:64px; height:92px; border-radius:8px; background:#fff; color:var(--black);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-weight:700; font-size:1.3em; box-shadow:0 2px 6px rgba(0,0,0,0.5);
    user-select:none; position:relative; border:1px solid #ccc;
  }
  .card.red{ color:var(--red); }
  .card.back{
    background:repeating-linear-gradient(45deg, #1a3b8f, #1a3b8f 6px, #274bb5 6px, #274bb5 12px);
    border:2px solid #0d1f4d;
  }
  .card.small{ width:44px; height:64px; font-size:0.85em; }
  .card.playable{ box-shadow:0 0 0 3px var(--gold), 0 4px 10px rgba(0,0,0,0.6); cursor:pointer; transform:translateY(-6px); }
  .card.playable:hover{ transform:translateY(-14px); }
  .card .corner{ position:absolute; top:3px; left:5px; font-size:0.5em; line-height:1em; }

  #trumpCard{ display:flex; flex-direction:column; align-items:center; gap:4px; }

  #table{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    display:flex; flex-wrap:wrap; gap:14px; justify-content:center; align-items:center;
    width:60%; min-height:160px;
  }
  .pair{ position:relative; width:64px; height:92px; }
  .pair .attack{ position:absolute; top:0; left:0; }
  .pair .defense{ position:absolute; top:14px; left:16px; }

  .opponent{
    position:absolute; display:flex; flex-direction:column; align-items:center; gap:4px; z-index:6;
  }
  .opponent .cards{ display:flex; }
  .opponent .cards .card.small{ margin-left:-26px; }
  .opponent .cards .card.small:first-child{ margin-left:0; }
  .opponent .name{
    font-size:0.8em; background:rgba(0,0,0,0.4); padding:2px 10px; border-radius:12px;
  }
  .opponent .name.active{ background:var(--gold); color:#3a2a00; font-weight:700; }
  .opponent .status{ font-size:0.72em; background:rgba(0,0,0,0.5); padding:2px 8px; border-radius:10px; color:var(--gold);}

  #opp-top{ top:14px; left:50%; transform:translateX(-50%); }
  #opp-left{ left:14px; top:50%; transform:translateY(-50%); flex-direction:row-reverse;}
  #opp-left .cards{ flex-direction:column; }
  #opp-left .cards .card.small{ margin-left:0; margin-top:-46px; }
  #opp-left .cards .card.small:first-child{ margin-top:0; }
  #opp-right{ right:14px; top:50%; transform:translateY(-50%); }
  #opp-right .cards{ flex-direction:column; }
  #opp-right .cards .card.small{ margin-left:0; margin-top:-46px; }
  #opp-right .cards .card.small:first-child{ margin-top:0; }

  #hand{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    display:flex; gap:-10px; z-index:20;
  }
  #hand .card{ margin-left:-18px; }
  #hand .card:first-child{ margin-left:0; }
  #youName{
    position:absolute; bottom:118px; left:50%; transform:translateX(-50%);
    font-size:0.85em; background:rgba(0,0,0,0.4); padding:2px 12px; border-radius:12px; z-index:20;
  }
  #youName.active{ background:var(--gold); color:#3a2a00; font-weight:700; }

  #actions{
    position:absolute; bottom:10px; right:20px; display:flex; flex-direction:column; gap:10px; z-index:30;
  }
  #actions button{ font-size:1.1em; padding:14px 22px; border-radius:14px; }

  #overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none;
    align-items:center; justify-content:center; z-index:100; flex-direction:column; gap:16px;
  }
  #overlay .box{ background:#222; padding:30px 40px; border-radius:16px; text-align:center; }

  #waitingBanner{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.5); padding:10px 20px; border-radius:10px; font-size:0.9em; z-index:4;
    display:none;
  }
</style>
</head>
<body>

<!-- ============================ МЕНЮ ============================ -->
<div id="menu">
  <h1>🂡 ДУРАК</h1>

  <div class="menu-card">
    <label>Ваше имя</label>
    <input type="text" id="playerName" placeholder="Игрок" value="Игрок">
    <hr class="sep">
    <label>Количество игроков</label>
    <select id="numPlayers">
      <option value="2">2 игрока</option>
      <option value="3">3 игрока</option>
      <option value="4">4 игрока</option>
    </select>
    <div class="row">
      <button class="btn-primary" id="btnPlayBots" style="flex:1">Играть с ботами</button>
    </div>
    <hr class="sep">
    <button class="btn-secondary" id="btnCreateRoom">Создать комнату</button>
    <div class="row">
      <input type="text" id="joinCode" placeholder="Код комнаты" style="flex:1">
      <button class="btn-secondary" id="btnJoinRoom">Войти</button>
    </div>
    <div id="menuError" style="color:#ffb3b3; font-size:0.85em;"></div>
  </div>

  <div class="menu-card" id="lobbyBox" style="display:none;">
    <div>Код комнаты: <b id="lobbyCode"></b></div>
    <div id="lobbyPlayers"></div>
    <button class="btn-primary" id="btnStartNow" style="display:none;">Начать игру сейчас</button>
  </div>
</div>

<!-- ============================ ИГРА ============================ -->
<div id="game">
  <div id="topbar"></div>
  <div id="logbox"></div>

  <div id="deckArea">
    <div id="trumpCard"></div>
    <div class="card back" id="deckPile"></div>
    <div id="deckCount"></div>
  </div>

  <div id="opp-top" class="opponent"></div>
  <div id="opp-left" class="opponent"></div>
  <div id="opp-right" class="opponent"></div>

  <div id="table"></div>
  <div id="waitingBanner"></div>

  <div id="youName"></div>
  <div id="hand"></div>

  <div id="actions"></div>
</div>

<div id="overlay">
  <div class="box">
    <h2 id="overlayTitle"></h2>
    <button class="btn-primary" onclick="location.reload()">Играть снова</button>
  </div>
</div>

<script>
const socket = io();
let myIdx = null;
let currentState = null;

const menu = document.getElementById('menu');
const gameEl = document.getElementById('game');
const lobbyBox = document.getElementById('lobbyBox');

document.getElementById('btnPlayBots').onclick = () => {
  const numPlayers = parseInt(document.getElementById('numPlayers').value, 10);
  const name = document.getElementById('playerName').value || 'Игрок';
  socket.emit('createLocalGame', { numPlayers, name });
};

document.getElementById('btnCreateRoom').onclick = () => {
  const numPlayers = parseInt(document.getElementById('numPlayers').value, 10);
  const name = document.getElementById('playerName').value || 'Игрок';
  socket.emit('createRoom', { numPlayers, name });
};

document.getElementById('btnJoinRoom').onclick = () => {
  const code = document.getElementById('joinCode').value.trim();
  const name = document.getElementById('playerName').value || 'Игрок';
  if (!code) return;
  socket.emit('joinRoom', { code, name });
};

document.getElementById('btnStartNow').onclick = () => {
  socket.emit('startRoomNow');
};

socket.on('errorMsg', (msg) => {
  document.getElementById('menuError').textContent = msg;
});

socket.on('roomCreated', ({ code }) => {
  lobbyBox.style.display = 'flex';
  document.getElementById('lobbyCode').textContent = code;
  document.getElementById('btnStartNow').style.display = 'inline-block';
});

socket.on('lobby', (data) => {
  lobbyBox.style.display = 'flex';
  document.getElementById('lobbyCode').textContent = data.code;
  document.getElementById('lobbyPlayers').innerHTML =
    'Игроки (' + data.players.length + '/' + data.numPlayers + '): ' + data.players.join(', ');
  document.getElementById('btnStartNow').style.display = data.isHost ? 'inline-block' : 'none';
});

socket.on('state', (state) => {
  currentState = state;
  myIdx = state.yourIdx;
  menu.style.display = 'none';
  gameEl.style.display = 'block';
  render(state);
  if (state.status === 'finished') {
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('overlayTitle').textContent =
      state.loser ? ('Игра окончена! Дурак: ' + state.loser) : 'Игра окончена вничью!';
  }
});

// -------------------- Рендер карт --------------------
function suitColor(suit){ return (suit === '♥' || suit === '♦') ? 'red' : ''; }

function cardEl(card, opts={}){
  const div = document.createElement('div');
  div.className = 'card ' + suitColor(card.suit) + (opts.small ? ' small' : '') + (opts.playable ? ' playable' : '');
  div.innerHTML = `<div>${card.rank}</div><div>${card.suit}</div>`;
  if (opts.onClick) div.onclick = opts.onClick;
  return div;
}

function backCardEl(small=true){
  const div = document.createElement('div');
  div.className = 'card back' + (small ? ' small' : '');
  return div;
}

function render(state){
  // topbar
  document.getElementById('topbar').textContent =
    'Комната: ' + state.code + '   |   Козырь: ' + state.trumpSuit + '   |   В колоде: ' + state.deckCount;

  document.getElementById('logbox').innerHTML = state.log.map(l => '<div>' + l + '</div>').join('');

  // deck / trump
  const trumpBox = document.getElementById('trumpCard');
  trumpBox.innerHTML = '';
  if (state.trumpCard) trumpBox.appendChild(cardEl(state.trumpCard, { small:true }));
  document.getElementById('deckCount').textContent = state.deckCount + ' карт';
  document.getElementById('deckPile').style.display = state.deckCount > 0 ? 'block' : 'none';

  // opponents seating: everyone except me, in order starting from next after me
  const n = state.players.length;
  const others = [];
  for (let k = 1; k < n; k++) others.push(state.players[(myIdx + k) % n]);

  const slots = ['opp-left','opp-top','opp-right'];
  // choose slot mapping depending on number of opponents
  let slotOrder;
  if (others.length === 1) slotOrder = ['opp-top'];
  else if (others.length === 2) slotOrder = ['opp-left','opp-right'];
  else slotOrder = ['opp-left','opp-top','opp-right'];

  slots.forEach(s => { document.getElementById(s).innerHTML = ''; document.getElementById(s).style.display='none'; });

  others.forEach((p, i) => {
    const slotId = slotOrder[i];
    if (!slotId) return;
    const el = document.getElementById(slotId);
    el.style.display = 'flex';
    const nameDiv = document.createElement('div');
    nameDiv.className = 'name' + ((p.isAttacker || p.isDefender) ? ' active' : '');
    nameDiv.textContent = p.name + (p.isAttacker ? ' (атакует)' : p.isDefender ? ' (защита)' : '');
    const cardsDiv = document.createElement('div');
    cardsDiv.className = 'cards';
    for (let c = 0; c < p.handCount; c++) cardsDiv.appendChild(backCardEl(true));
    const statusDiv = document.createElement('div');
    statusDiv.className = 'status';
    if (!p.connected) statusDiv.textContent = 'отключен';
    else if (state.awaiting && state.awaiting.playerIdx === p.idx) {
      statusDiv.textContent = state.awaiting.type === 'defend' ? 'защищается...' :
        state.awaiting.type === 'attack' ? 'ходит...' :
        state.awaiting.type === 'bito' ? 'решает...' : 'думает...';
    } else statusDiv.textContent = '';
    el.appendChild(nameDiv);
    el.appendChild(cardsDiv);
    if (statusDiv.textContent) el.appendChild(statusDiv);
  });

  // table
  const tableEl = document.getElementById('table');
  tableEl.innerHTML = '';
  state.table.forEach(pair => {
    const pd = document.createElement('div');
    pd.className = 'pair';
    const a = cardEl(pair.attack);
    a.classList.add('attack');
    pd.appendChild(a);
    if (pair.defense) {
      const d = cardEl(pair.defense);
      d.classList.add('defense');
      pd.appendChild(d);
    }
    tableEl.appendChild(pd);
  });

  // your name / status
  const me = state.players[myIdx];
  const youName = document.getElementById('youName');
  youName.textContent = me.name + (me.isAttacker ? ' (вы атакуете)' : me.isDefender ? ' (вы защищаетесь)' : '');
  youName.className = (me.isAttacker || me.isDefender) ? 'active' : '';

  // hand
  const handEl = document.getElementById('hand');
  handEl.innerHTML = '';
  const awaiting = state.awaiting;
  const iAmAwaited = awaiting && awaiting.playerIdx === myIdx;

  let playableIds = new Set();
  if (iAmAwaited) {
    if (awaiting.type === 'attack') {
      state.yourHand.forEach(c => playableIds.add(c.id));
    } else if (awaiting.type === 'throw') {
      const ranks = new Set();
      state.table.forEach(p => { ranks.add(p.attack.rank); if (p.defense) ranks.add(p.defense.rank); });
      state.yourHand.forEach(c => { if (ranks.has(c.rank)) playableIds.add(c.id); });
    } else if (awaiting.type === 'defend') {
      const pending = state.table[state.table.length - 1];
      state.yourHand.forEach(c => {
        const beats = (c.suit === pending.attack.suit && c.value > pending.attack.value) ||
                      (c.suit === state.trumpSuit && pending.attack.suit !== state.trumpSuit);
        if (beats) playableIds.add(c.id);
      });
    }
  }

  state.yourHand.forEach(c => {
    const playable = playableIds.has(c.id);
    const el = cardEl(c, {
      playable,
      onClick: playable ? () => onCardClick(awaiting.type, c.id) : null
    });
    handEl.appendChild(el);
  });

  // actions
  const actions = document.getElementById('actions');
  actions.innerHTML = '';
  if (iAmAwaited) {
    if (awaiting.type === 'defend') {
      const btn = document.createElement('button');
      btn.className = 'btn-danger';
      btn.textContent = 'БЕРУ';
      btn.onclick = () => socket.emit('takeCards');
      actions.appendChild(btn);
    } else if (awaiting.type === 'throw') {
      const btn = document.createElement('button');
      btn.className = 'btn-blue';
      btn.textContent = 'ПАС';
      btn.onclick = () => socket.emit('pass');
      actions.appendChild(btn);
    } else if (awaiting.type === 'bito') {
      const btn = document.createElement('button');
      btn.className = 'btn-yellow';
      btn.textContent = 'БИТО';
      btn.onclick = () => socket.emit('bito');
      actions.appendChild(btn);
    }
  }
}

function onCardClick(type, cardId){
  if (type === 'attack' || type === 'throw') {
    socket.emit('playCard', { cardId });
  } else if (type === 'defend') {
    socket.emit('defendCard', { cardId });
  }
}
</script>
</body>
</html>
