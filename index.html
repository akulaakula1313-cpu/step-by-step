<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карточная игра «Дурак»</title>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        :root {
            --table-green: #0d5c32;
            --card-w: 72px;
            --card-h: 104px;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0; background: #06331b;
            font-family: 'Roboto', sans-serif; color: #fff;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        #game-container {
            width: 100vw; height: 100vh; max-width: 1366px; max-height: 768px;
            background: var(--table-green);
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
            padding: 12px; box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
        }

        .top-navbar {
            position: absolute; top: 0; left: 0; width: 100%; height: 40px;
            background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; z-index: 100; font-size: 13px;
        }
        .nav-left, .nav-right { display: flex; align-items: center; gap: 15px; cursor: pointer; opacity: 0.9; }
        .nav-left:hover, .nav-right:hover { opacity: 1; }
        .room-badge { background: rgba(241, 196, 15, 0.2); border: 1px solid #f1c40f; color: #f1c40f; padding: 2px 8px; border-radius: 4px; font-weight: bold; letter-spacing: 1px; }

        #main-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 500;
        }
        .menu-modal {
            background: #111a14; border: 1px solid #1e3325; padding: 25px;
            border-radius: 10px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .menu-title { font-size: 20px; font-weight: 700; color: #fff; }
        
        .players-select-box { display: flex; background: #09100c; padding: 12px; border-radius: 8px; width: 100%; justify-content: space-around; }
        .p-opt { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; opacity: 0.5; }
        .p-opt.active { opacity: 1; }
        .p-opt-icon { width: 36px; height: 36px; background: #164e2d; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; border: 2px solid transparent; }
        .p-opt.active .p-opt-icon { border-color: #2ecc71; background: #1b663b; }
        .p-opt-lbl { font-size: 11px; color: #a0b5a8; }

        .btn-start {
            width: 100%; padding: 12px; background: #f1c40f; border: none; border-radius: 6px;
            color: #111; font-weight: bold; font-size: 14px; cursor: pointer; text-transform: uppercase;
        }
        .btn-start:hover { background: #f39c12; }
        .menu-divider { width: 100%; height: 1px; background: #1c2b21; }
        .room-join-row { display: flex; gap: 8px; width: 100%; }
        .room-input { flex: 1; background: #09100c; border: 1px solid #1c2b21; padding: 10px; border-radius: 6px; color: #fff; text-align: center; text-transform: uppercase; outline: none; }

        #game-over-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 600;
        }
        .modal-card {
            background: #111a14; border: 2px solid #2ecc71; padding: 30px;
            border-radius: 12px; width: 100%; max-width: 380px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 15px;
        }
        .modal-title { font-size: 22px; font-weight: bold; color: #f1c40f; }
        .modal-subtitle { font-size: 14px; color: #a0b5a8; }
        .btn-rematch {
            width: 100%; padding: 12px; background: #2ecc71; border: none; border-radius: 6px;
            color: #fff; font-weight: bold; font-size: 15px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4);
        }
        .btn-rematch:hover { background: #27ae60; }
        .rematch-status { font-size: 12px; color: #f1c40f; }

        .seat { position: absolute; display: flex; flex-direction: column; align-items: center; z-index: 20; }
        .seat-top { top: 50px; left: 50%; transform: translateX(-50%); }
        .seat-left { top: 42%; left: 20px; transform: translateY(-50%); }
        .seat-right { top: 42%; right: 20px; transform: translateY(-50%); }

        .player-profile { display: flex; flex-direction: column; align-items: center; position: relative; margin-bottom: 6px; }
        .avatar { width: 42px; height: 42px; background: #2c3e50; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.4); overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .p-name { font-size: 11px; font-weight: 500; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 10px; margin-top: -8px; z-index: 5; }

        .speech-bubble {
            position: absolute; top: -26px; background: #fff; color: #111; padding: 2px 8px;
            border-radius: 10px; font-size: 10px; font-weight: bold; white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3); z-index: 10;
        }
        .speech-bubble.turn { background: #f1c40f; color: #111; animation: pulse 1.2s infinite; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

        .opp-hand { display: flex; }
        .card-img-back {
            width: 24px; height: 35px; border-radius: 3px; margin-left: -12px;
            box-shadow: -2px 2px 5px rgba(0,0,0,0.4); object-fit: cover;
        }
        .opp-hand .card-img-back:first-child { margin-left: 0; }
        .seat-left .opp-hand, .seat-right .opp-hand { flex-direction: column; }
        .seat-left .card-img-back, .seat-right .card-img-back { margin-left: 0; margin-top: -24px; width: 35px; height: 24px; }
        .seat-left .opp-hand .card-img-back:first-child, .seat-right .opp-hand .card-img-back:first-child { margin-top: 0; }

        #deck-area { position: absolute; left: 340px; top: 42%; transform: translateY(-50%); display: flex; align-items: center; z-index: 10; }
        .card-img-elem {
            width: var(--card-w); height: var(--card-h); border-radius: 6px;
            box-shadow: -2px 3px 8px rgba(0,0,0,0.4); cursor: pointer; object-fit: fill; background: #fff;
        }
        .trump-card-under { position: absolute; left: 0; top: 0; transform: rotate(90deg); z-index: -1; }
        .deck-counter-badge {
            position: absolute; right: -25px; bottom: 0; background: rgba(0,0,0,0.7);
            padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; color: #f1c40f;
        }

        #table-area {
            position: absolute; left: 430px; right: 260px; top: 38%; transform: translateY(-50%);
            min-height: 120px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; z-index: 15;
        }
        .table-pair { position: relative; width: calc(var(--card-w) + 16px); height: var(--card-h); }
        .table-pair img:first-child { position: absolute; left: 0; top: 0; }
        .table-pair img:nth-child(2) { position: absolute; left: 16px; top: 12px; z-index: 2; }

        #player-area { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 100%; max-width: 850px; display: flex; flex-direction: column; align-items: center; z-index: 25; }
        .my-hand { display: flex; justify-content: center; align-items: flex-end; margin-top: 6px; }
        .my-card-wrap { cursor: pointer; transition: 0.15s; margin-left: -28px; }
        .my-card-wrap:first-child { margin-left: 0; }
        .my-card-wrap:hover { transform: translateY(-16px); z-index: 100; }

        .action-bar { display: flex; gap: 10px; margin-bottom: 6px; }
        .action-btn { padding: 8px 22px; border-radius: 4px; font-weight: bold; font-size: 13px; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-take { background: #e74c3c; color: #fff; }
        .btn-done { background: #f1c40f; color: #111; }
        .btn-pass { background: #3498db; color: #fff; }
        .action-btn:disabled { opacity: 0.4; cursor: not-allowed; display: none; }

        #msg-box { background: rgba(0,0,0,0.6); padding: 4px 14px; border-radius: 12px; font-size: 12px; color: #f1c40f; margin-bottom: 6px; text-align: center; }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="top-navbar">
            <div class="nav-left" onclick="location.reload()">♠ Карточная игра «Дурак»</div>
            <div id="room-code-display" class="room-badge" style="display:none;">КОМНАТА: <span id="r-code-val"></span></div>
            <div class="nav-right"><span onclick="toggleMusic()">🎵 Звук</span></div>
        </div>

        <div id="main-menu">
            <div class="menu-modal">
                <div class="menu-title">С кем будете играть?</div>
                <div class="players-select-box">
                    <div class="p-opt active" onclick="setCount(2)">
                        <div class="p-opt-icon">2</div>
                        <div class="p-opt-lbl">Вдвоем</div>
                    </div>
                    <div class="p-opt" onclick="setCount(3)">
                        <div class="p-opt-icon">3</div>
                        <div class="p-opt-lbl">Втроем</div>
                    </div>
                    <div class="p-opt" onclick="setCount(4)">
                        <div class="p-opt-icon">4</div>
                        <div class="p-opt-lbl">Вчетвером</div>
                    </div>
                </div>
                <button class="btn-start" onclick="playWithBots()">🤖 Играть с ботами</button>
                <div class="menu-divider"></div>
                <button class="btn-start" style="background:#2ecc71; color:#fff;" onclick="createRoom()">✨ Создать комнату</button>
                <div class="room-join-row">
                    <input type="text" id="room-code" class="room-input" placeholder="Код комнаты" maxlength="6">
                    <button class="btn-start" style="width: auto; padding: 10px 20px;" onclick="joinRoom()">Войти</button>
                </div>
            </div>
        </div>

        <div id="game-over-modal">
            <div class="modal-card">
                <div id="go-title" class="modal-title">Игра окончена</div>
                <div id="go-desc" class="modal-subtitle">Результат партии</div>
                <button id="btn-rematch" class="btn-rematch" onclick="voteRematch()">ИГРАТЬ СНОВА (РЕВАНШ)</button>
                <div id="rematch-counter" class="rematch-status">Ожидание игроков: 15с</div>
            </div>
        </div>

        <!-- Seats for opponents -->
        <div id="seat-top" class="seat seat-top" style="display:none;"></div>
        <div id="seat-left" class="seat seat-left" style="display:none;"></div>
        <div id="seat-right" class="seat seat-right" style="display:none;"></div>

        <!-- Deck area -->
        <div id="deck-area" style="display:none;">
            <div style="position:relative;">
                <div id="trump-under" class="trump-card-under"></div>
                <img id="deck-top-card" class="card-img-elem" src="https://deckofcardsapi.com/static/img/back.png" alt="Колода">
                <div id="deck-counter" class="deck-counter-badge">36</div>
            </div>
        </div>

        <!-- Table area -->
        <div id="table-area"></div>

        <!-- Player area -->
        <div id="player-area">
            <div id="msg-box">Ожидание начала игры...</div>
            <div class="action-bar">
                <button id="btn-take" class="action-btn btn-take" style="display:none;" onclick="sendAction('take')">БЕРУ</button>
                <button id="btn-pass" class="action-btn btn-pass" style="display:none;" onclick="sendAction('pass')">ПАС</button>
                <button id="btn-done" class="action-btn btn-done" style="display:none;" onclick="sendAction('done')">БИТО</button>
            </div>
            <div id="my-cards-container" class="my-hand"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let selectedMaxPlayers = 2;
        let currentRoomCode = null;
        let gameState = null;
        let bgMusic = new Audio('./theme.mp3');
        bgMusic.loop = true;
        let musicOn = false;

        function toggleMusic() {
            musicOn = !musicOn;
            if (musicOn) bgMusic.play().catch(()=>{}); else bgMusic.pause();
        }

        function setCount(num) {
            selectedMaxPlayers = num;
            document.querySelectorAll('.p-opt').forEach((el, idx) => {
                el.classList.toggle('active', idx + 2 === num);
            });
        }

        function playWithBots() { socket.emit('play_with_bots', selectedMaxPlayers); }
        function createRoom() { socket.emit('create_room', selectedMaxPlayers); }
        function joinRoom() {
            let code = document.getElementById('room-code').value.trim().toUpperCase();
            if (code) { currentRoomCode = code; socket.emit('join_room', code); }
        }

        function showRoomCode(code) {
            if (code && !code.startsWith('BOTS_')) {
                document.getElementById('r-code-val').innerText = code;
                document.getElementById('room-code-display').style.display = 'block';
            }
        }

        socket.on('room_created', (data) => { currentRoomCode = data.code; showRoomCode(data.code); document.getElementById('main-menu').style.display='none'; });
        socket.on('lobby_update', (data) => { currentRoomCode = data.code; showRoomCode(data.code); document.getElementById('main-menu').style.display='none'; });
        socket.on('game_update', (state) => {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('deck-area').style.display = 'flex';
            gameState = state;
            if (state.roomCode) { currentRoomCode = state.roomCode; showRoomCode(state.roomCode); }
            render();
        });
        socket.on('error_msg', (msg) => { alert(msg); });
        socket.on('game_over', (data) => {
            let titleEl = document.getElementById('go-title');
            let descEl = document.getElementById('go-desc');
            if (data.winner === socket.id) {
                titleEl.innerText = "ПОБЕДА!";
                descEl.innerText = "Вы выиграли эту партию!";
            } else if (data.winner) {
                titleEl.innerText = "ПОРАЖЕНИЕ";
                descEl.innerText = "Вы остались в дураках...";
            } else {
                titleEl.innerText = "НИЧЬЯ";
                descEl.innerText = "Партия закончилась вничью.";
            }
            document.getElementById('btn-rematch').disabled = false;
            document.getElementById('btn-rematch').style.opacity = "1";
            document.getElementById('game-over-modal').style.display = 'flex';
        });
        socket.on('rematch_timer', (timeLeft) => {
            document.getElementById('rematch-counter').innerText = `Авто-выход через: ${timeLeft}с`;
        });
        socket.on('rematch_voted', (data) => {
            document.getElementById('rematch-counter').innerText = `Голосов за реванш: ${data.votesCount} / ${data.totalNeeded}`;
        });
        socket.on('game_restarted', () => {
            document.getElementById('game-over-modal').style.display = 'none';
        });
        socket.on('room_expired', () => {
            alert("Время реванша истекло. Комната закрыта.");
            location.reload();
        });

        function voteRematch() {
            let rCode = currentRoomCode || (gameState && gameState.roomCode);
            if (!rCode) return;
            socket.emit('vote_rematch', rCode);
            document.getElementById('btn-rematch').disabled = true;
            document.getElementById('btn-rematch').style.opacity = "0.5";
            document.getElementById('rematch-counter').innerText = "Вы проголосовали! Ожидание остальных...";
        }

        function getCardImageUrl(card) {
            if (!card || !card.rank || !card.suit) return 'https://deckofcardsapi.com/static/img/back.png';
            let suitMap = { '♠': 'S', '♥': 'H', '♦': 'D', '♣': 'C' };
            let rankMap = { '10': '0' };
            let r = rankMap[card.rank] || card.rank;
            let s = suitMap[card.suit] || 'S';
            return `https://deckofcardsapi.com/static/img/${r}${s}.png`;
        }

        function getTableRanks(table) {
            let ranks = new Set();
            for (let p of table) { ranks.add(p.attack.rank); if (p.defense) ranks.add(p.defense.rank); }
            return ranks;
        }

        function render() {
            if (!gameState) return;
            let myId = socket.id;
            let pInfo = gameState.playersInfo || [];
            let myIdx = pInfo.findIndex(p => p.id === myId);
            if (myIdx === -1) return;

            let seats = ['seat-top', 'seat-left', 'seat-right'];
            seats.forEach(s => {
                let el = document.getElementById(s);
                if (el) el.style.display = 'none';
            });

            let seatMap = [];
            if (pInfo.length === 2) seatMap = ['seat-top'];
            else if (pInfo.length === 3) seatMap = ['seat-left', 'seat-right'];
            else if (pInfo.length === 4) seatMap = ['seat-left', 'seat-top', 'seat-right'];

            let offsetIdx = 0;
            for (let i = 1; i < pInfo.length; i++) {
                let targetPlayerIdx = (myIdx + i) % pInfo.length;
                let p = pInfo[targetPlayerIdx];
                let seatEl = document.getElementById(seatMap[offsetIdx++]);
                if (!seatEl) continue;

                let cardCount = (gameState.hands && gameState.hands[p.id]) ? gameState.hands[p.id].length : 0;
                let isDef = gameState.defenderIdx === targetPlayerIdx;
                let isCurrentTurn = gameState.currentThrowerIdx === targetPlayerIdx;

                let bubbleText = "";
                let bubbleClass = "speech-bubble";
                if (isDef) {
                    bubbleText = "Кроюсь";
                } else if (isCurrentTurn && gameState.table && gameState.table.length > 0) {
                    bubbleText = "Подкидывает...";
                    bubbleClass += " turn";
                } else if (gameState.attackerIdx === targetPlayerIdx && (!gameState.table || gameState.table.length === 0)) {
                    bubbleText = "Ходит";
                }

                let bubbleHTML = bubbleText ? `<div class="${bubbleClass}">${bubbleText}</div>` : '';
                let backCardsHTML = Array(cardCount).fill(0).map(() => `<img class="card-img-back" src="https://deckofcardsapi.com/static/img/back.png" alt="card">`).join('');
                seatEl.innerHTML = `<div class="player-profile"> ${bubbleHTML} <div class="avatar"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=${p.id}" alt=""></div> <div class="p-name">${p.name}</div> </div> <div class="opp-hand">${backCardsHTML}</div>`;
                seatEl.style.display = 'flex';
            }

            let deckCounter = document.getElementById('deck-counter');
            if (deckCounter) deckCounter.innerText = (gameState.deck || []).length;

            let tu = document.getElementById('trump-under');
            if (tu) {
                if (gameState.trumpCard && gameState.trumpCard.rank) {
                    tu.innerHTML = `<img class="card-img-elem" src="${getCardImageUrl(gameState.trumpCard)}" alt="trump">`;
                    tu.style.display = 'block';
                } else { tu.style.display = 'none'; }
            }

            let topCard = document.getElementById('deck-top-card');
            if (topCard) {
                if(!gameState.deck || gameState.deck.length === 0) {
                    topCard.style.display = 'none';
                } else {
                    topCard.style.display = 'block';
                }
            }

            let tArea = document.getElementById('table-area');
            if (tArea) {
                if (!gameState.table || gameState.table.length === 0) {
                    tArea.innerHTML = '';
                } else {
                    tArea.innerHTML = gameState.table.map(p => `<div class="table-pair"> <img class="card-img-elem" src="${getCardImageUrl(p.attack)}" alt="attack"> ${p.defense ? `<img class="card-img-elem" src="${getCardImageUrl(p.defense)}" alt="defense" style="position:absolute; left:16px; top:12px; z-index:2;">` : ''} </div>`).join('');
                }
            }

            let myHand = (gameState.hands && gameState.hands[myId]) ? gameState.hands[myId] : [];
            let myCardsEl = document.getElementById('my-cards-container');
            if (myCardsEl) {
                myCardsEl.innerHTML = myHand.map((c, idx) => `<div class="my-card-wrap" data-card-idx="${idx}" onclick="playCard(${idx})"> <img class="card-img-elem" src="${getCardImageUrl(c)}" style="pointer-events: none;" alt="mycard"> </div>`).join('');
            }

            let isDefMe = gameState.defenderIdx === myIdx;
            let isAttMe = gameState.attackerIdx === myIdx;
            let isMyThrowTurn = gameState.currentThrowerIdx === myIdx;
            let msg = document.getElementById('msg-box');
            let tRanks = getTableRanks(gameState.table || []);
            let hasCardsToThrow = myHand.some(c => tRanks.has(c.rank));

            if (msg) {
                if (isDefMe) {
                    msg.innerText = "Вы защищаетесь! Кликните карту, чтобы побить.";
                    msg.style.color = "#e74c3c";
                } else if (gameState.table && gameState.table.length > 0) {
                    if (isMyThrowTurn && hasCardsToThrow) {
                        msg.innerText = "Ваша очередь подкидывать! Можете походить или нажать ПАС.";
                        msg.style.color = "#f1c40f";
                    } else if (hasCardsToThrow) {
                        msg.innerText = "У вас есть подходящие карты для подкидывания.";
                        msg.style.color = "#f1c40f";
                    } else {
                        msg.innerText = "Стол занят (ход других игроков)...";
                        msg.style.color = "#a0b5a8";
                    }
                } else if (isAttMe) {
                    msg.innerText = "Ваш первый ход! Кликните карту.";
                    msg.style.color = "#f1c40f";
                } else {
                    msg.innerText = "Ход соперника...";
                    msg.style.color = "#a0b5a8";
                }
            }

            let allCovered = gameState.table && gameState.table.length > 0 && gameState.table.every(p => p.defense !== null);
            let btnTake = document.getElementById('btn-take');
            let btnDone = document.getElementById('btn-done');
            let btnPass = document.getElementById('btn-pass');
            btnTake.style.display = (isDefMe && gameState.table && gameState.table.length > 0) ? 'block' : 'none';
            btnDone.style.display = (!isDefMe && gameState.table && gameState.table.length > 0 && allCovered) ? 'block' : 'none';
            btnPass.style.display = (!isDefMe && gameState.table && gameState.table.length > 0 && isMyThrowTurn && hasCardsToThrow) ? 'block' : 'none';
        }

        function playCard(idx) {
            let rCode = currentRoomCode || (gameState && gameState.roomCode);
            if (!rCode) return;
            socket.emit('player_action', { roomCode: rCode, action: 'play_card', cardIdx: idx });
        }

        function sendAction(action) {
            let rCode = currentRoomCode || (gameState && gameState.roomCode);
            if (!rCode) return;
            socket.emit('player_action', { roomCode: rCode, action });
        }
    </script>
